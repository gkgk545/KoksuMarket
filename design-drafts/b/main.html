<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곡수마켓 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Gothic+A1:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121418; --ink-2:#3d424a; --mute:#646a73;
  --paper:#eceee9; --card:#ffffff; --line:#c9ccc5;
  --sig:#ffc21a; --sig-press:#f0b000;
  --err:#c4231b; --err-bg:#fdecea;
  --rule:4px;
  --num:"Barlow","Gothic A1",sans-serif;
  --kr:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--kr);color:var(--ink);background:var(--paper);min-height:100vh;font-size:16px;line-height:1.5;word-break:keep-all}
::selection{background:var(--sig);color:var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:minmax(300px,5fr) minmax(0,7fr);min-height:100vh}
.board{background:var(--ink);color:#fff;padding:48px 48px 40px;display:flex;flex-direction:column;gap:40px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none}
.brand-plate{width:56px;height:56px;background:var(--sig);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:32px;line-height:1}
.brand-word{font-weight:900;font-size:30px;letter-spacing:-.02em}
.board-title{font-weight:900;font-size:clamp(40px,4.6vw,64px);line-height:1.12;letter-spacing:-.035em;margin-top:auto}
.board-title em{font-style:normal;background:var(--sig);color:var(--ink);padding:.06em .12em 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.board-sub{font-size:18px;color:#d5d8dd;font-weight:500;max-width:22em}
.exits{display:flex;flex-wrap:wrap;border-top:var(--rule) solid #fff}
.exit{flex:1 1 50%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 4px 4px;font-weight:800;font-size:18px;text-decoration:none;min-height:56px}
.exit + .exit{padding-left:20px;border-left:2px solid #4a4f57}
.exit svg{flex:none;transition:transform .2s var(--ease)}
.exit:hover svg{transform:translateX(4px)}
.exit:hover span{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.exit:focus-visible{outline-color:var(--sig)}

/* ---------- work area ---------- */
.work{padding:48px clamp(20px,5vw,72px) 40px;display:flex;flex-direction:column;gap:36px;max-width:820px;width:100%}

/* route strip = step indicator */
.route{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);position:relative}
.route li{position:relative}
.route li:not(:last-child)::before{content:"";position:absolute;top:23px;left:25px;right:0;border-top:4px dashed var(--ink)}
.route li.done::before{border-top:6px solid var(--ink);top:22px}
.stop{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:0 8px 0 0;min-height:48px}
.dot{width:50px;height:50px;border-radius:50%;border:var(--rule) solid var(--ink);background:var(--card);display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:22px;transition:background .2s}
.done .dot{background:var(--ink);color:#fff}
.cur .dot{background:var(--sig)}
.stop-label{font-weight:800;font-size:17px;line-height:1.2}
.stop-val{font-size:14px;color:var(--ink-2);font-weight:500;min-height:21px}
.stop:hover .stop-label{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

.panel{border-top:var(--rule) solid var(--ink);padding-top:28px}
.panel[hidden]{display:none}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-weight:900;font-size:36px;letter-spacing:-.03em;line-height:1.2}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:16px;padding:10px 4px;min-height:44px;color:var(--ink-2)}
.back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}

/* grade tiles */
.grades{display:grid;grid-template-columns:repeat(4,1fr);border-left:var(--rule) solid var(--ink);border-top:var(--rule) solid var(--ink)}
.grade{border-right:var(--rule) solid var(--ink);border-bottom:var(--rule) solid var(--ink);background:var(--card);aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:16px 18px;transition:background .15s}
.grade b{font-family:var(--num);font-weight:800;font-size:clamp(64px,8vw,104px);line-height:.9;letter-spacing:-.04em}
.grade span{font-weight:800;font-size:20px}
.grade:hover{background:var(--sig)}
.grade:active{background:var(--sig-press)}
.grade.sel{background:var(--ink);color:#fff}

/* names */
.names{display:grid;grid-template-columns:repeat(4,1fr);border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
.name{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--card);min-height:64px;padding:12px 14px;font-weight:700;font-size:19px;text-align:left;display:flex;align-items:center;gap:10px;transition:background .15s}
.name i{font-style:normal;font-family:var(--num);font-weight:700;font-size:14px;color:var(--mute);min-width:1.4em}
.name:hover{background:var(--sig)}
.name:hover i{color:var(--ink)}
.name.sel{background:var(--ink);color:#fff}
.name.sel i{color:#c9ccd1}

/* password */
.who{display:flex;align-items:center;gap:16px;background:var(--card);border:var(--rule) solid var(--ink);padding:16px 18px;margin-bottom:24px}
.plate{flex:none;width:52px;height:52px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:28px;line-height:1}
.who-name{font-weight:900;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.who-grade{font-size:15px;color:var(--ink-2);font-weight:500}
.who .back{margin-left:auto}
label.field{display:block;font-weight:800;font-size:18px;margin-bottom:10px}
.pw{display:flex;border:var(--rule) solid var(--ink);background:var(--card)}
.pw input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:16px 18px;font-size:24px;font-family:var(--num);font-weight:700;letter-spacing:.12em;outline:none;caret-color:var(--ink)}
.pw input::placeholder{font-family:var(--kr);letter-spacing:0;font-weight:500;font-size:18px;color:var(--mute)}
.pw:focus-within{box-shadow:0 0 0 3px var(--sig)}
.pw .peek{border-left:2px solid var(--ink);padding:0 18px;font-weight:700;font-size:15px;min-width:76px}
.pw .peek:hover{background:var(--paper)}
.pw.bad{border-color:var(--err)}
.pw.bad .peek{border-left-color:var(--err)}
.msg{display:none;align-items:flex-start;gap:10px;margin-top:12px;padding:12px 14px;background:var(--err-bg);color:var(--err);font-weight:700;font-size:16px;border-top:3px solid var(--err)}
.msg svg{flex:none;margin-top:2px}
.msg.show{display:flex}
.msg.ok{background:var(--sig);color:var(--ink);border-top-color:var(--ink)}
.go{margin-top:20px;width:100%;min-height:68px;background:var(--sig);border:var(--rule) solid var(--ink);font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;gap:12px;transition:background .15s}
.go:hover{background:var(--sig-press)}
.go:disabled{background:var(--paper);color:var(--mute);border-color:var(--line);cursor:not-allowed}
.hint{margin-top:14px;color:var(--ink-2);font-size:15px}

.demo{margin-top:auto;padding-top:20px;border-top:2px dashed var(--line);font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.demo button{text-decoration:underline;text-underline-offset:3px;font-size:13px;color:var(--ink-2);padding:6px 0}

.step-in{animation:stepIn .26s var(--ease)}
@keyframes stepIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .board-sub{display:none}
  .board{padding:20px 16px 0;gap:16px}
  .board-title{font-size:30px;margin-top:4px}
  .board-sub{font-size:15px}
  .exits{order:3;border-top-width:2px;border-top-color:#4a4f57}
  .exit{font-size:16px;padding:12px 0;min-height:48px}
  .work{padding:24px 16px 28px;gap:28px;max-width:none}
}
@media (max-width:560px){
  .grades{grid-template-columns:repeat(2,1fr)}
  .grade{aspect-ratio:auto;min-height:120px}
  .names{grid-template-columns:repeat(2,1fr)}
  h1{font-size:28px}
  .dot{width:44px;height:44px;font-size:19px}
  .route li:not(:last-child)::before{top:20px;left:22px}
  .route li.done::before{top:19px}
  .stop-label{font-size:15px}
  .who{flex-wrap:wrap}
  .who .back{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="board">
    <a class="brand" href="main.html" aria-label="곡수마켓 처음으로">
      <span class="brand-plate" aria-hidden="true">곡</span>
      <span class="brand-word">곡수마켓</span>
    </a>
    <p class="board-title">모은 <em>티켓</em>으로<br>우리 반 가게에서<br>사고 싶은 것 고르기</p>
    <p class="board-sub">학년, 이름, 비밀번호 순서로 들어가요.</p>
    <nav class="exits" aria-label="다른 페이지">
      <a class="exit" href="#ranking"><span>마켓 랭킹</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      <a class="exit" href="admin.html"><span>교사 페이지</span>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
    </nav>
  </aside>

  <main class="work">
    <ol class="route" aria-label="로그인 단계">
      <li class="cur" data-i="0"><button class="stop" type="button" data-go="grade"><span class="dot">1</span><span class="stop-label">학년</span><span class="stop-val" id="v-grade"></span></button></li>
      <li class="todo" data-i="1"><button class="stop" type="button" data-go="student"><span class="dot">2</span><span class="stop-label">이름</span><span class="stop-val" id="v-name"></span></button></li>
      <li class="todo" data-i="2"><button class="stop" type="button" data-go="password"><span class="dot">3</span><span class="stop-label">비밀번호</span><span class="stop-val"></span></button></li>
    </ol>

    <section class="panel" id="p-grade" aria-labelledby="h-grade">
      <div class="panel-head"><h1 id="h-grade">몇 학년인가요?</h1></div>
      <div class="grades" role="list">
        <button class="grade" type="button" data-grade="3" role="listitem"><b>3</b><span>학년</span></button>
        <button class="grade" type="button" data-grade="4" role="listitem"><b>4</b><span>학년</span></button>
        <button class="grade" type="button" data-grade="5" role="listitem"><b>5</b><span>학년</span></button>
        <button class="grade" type="button" data-grade="6" role="listitem"><b>6</b><span>학년</span></button>
      </div>
    </section>

    <section class="panel" id="p-student" aria-labelledby="h-student" hidden>
      <div class="panel-head">
        <h1 id="h-student">내 이름을 눌러요</h1>
        <button class="back" type="button" data-go="grade">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>학년 다시 고르기</button>
      </div>
      <div class="names" id="names"></div>
    </section>

    <section class="panel" id="p-password" aria-labelledby="h-password" hidden>
      <div class="panel-head"><h1 id="h-password">비밀번호를 넣어요</h1></div>
      <div class="who">
        <span class="plate num" id="who-plate">5</span>
        <div><p class="who-name" id="who-name">김하늘</p><p class="who-grade" id="who-grade">5학년</p></div>
        <button class="back" type="button" data-go="student">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>내 이름이 아니에요</button>
      </div>
      <form id="pw-form" novalidate>
        <label class="field" for="pw">비밀번호</label>
        <div class="pw" id="pw-box">
          <input id="pw" type="password" autocomplete="current-password" placeholder="선생님께 받은 비밀번호" aria-describedby="pw-msg">
          <button class="peek" type="button" id="peek" aria-pressed="false">보기</button>
        </div>
        <p class="msg" id="pw-msg" role="alert" aria-live="assertive">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v6M12 16.5v.5" stroke-linecap="square"/></svg>
          <span id="pw-msg-text">비밀번호가 달라요. 다시 입력해 보세요.</span>
        </p>
        <button class="go" type="submit" id="go" disabled>
          마켓 들어가기
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </button>
        <p class="hint">비밀번호를 잊었으면 선생님께 말해 주세요.</p>
      </form>
    </section>

    <p class="demo" aria-label="시안 확인용">
      <span>시안 확인용: 비밀번호 1234는 성공, 다른 값은 오류 화면이에요.</span>
      <button type="button" id="demo-err">오류 화면 바로 보기</button>
    </p>
  </main>
</div>

<script>
(function(){
  var roster = {
    3:["강도하","김로아","나윤슬","문지온","박이안","배시아","서하준","송다올","신채아","오이준","유은호","이소율"],
    4:["고은찬","김나래","김태오","노하윤","류시후","민서윤","박건","손하엘","안지유","윤재민","전보민","조아린","최온유","홍라희"],
    5:["김하늘","박서준","이도윤","최지아","정하린","강시우","조유나","윤지호","장서아","임건우","한예린","오준서","서다은","신우진","권나윤","황민재"],
    6:["구민결","김세아","남도현","문하람","박지율","백승아","성우빈","양서진","엄태린","이주원","정나은","차윤호","하지민"]
  };
  var state = {step:"grade", grade:null, name:null};
  var order = ["grade","student","password"];
  var $ = function(s){return document.querySelector(s)};
  var pw = $("#pw"), go = $("#go"), box = $("#pw-box"), msg = $("#pw-msg"), msgText = $("#pw-msg-text");

  function renderNames(){
    var list = roster[state.grade] || [];
    $("#names").innerHTML = list.map(function(n,i){
      return '<button type="button" class="name'+(n===state.name?' sel':'')+'" data-name="'+n+'"><i class="num">'+(i+1)+'</i>'+n+'</button>';
    }).join("");
  }
  function show(step){
    // fill sample values when jumping ahead from the route strip
    if(step!=="grade" && !state.grade) state.grade = 5;
    if(step==="password" && !state.name) state.name = roster[state.grade][0];
    state.step = step;
    order.forEach(function(s){
      var p = $("#p-"+s); var on = s===step;
      p.hidden = !on;
      if(on){ p.classList.remove("step-in"); void p.offsetWidth; p.classList.add("step-in"); }
    });
    var idx = order.indexOf(step);
    document.querySelectorAll(".route li").forEach(function(li,i){
      li.className = i<idx ? "done" : (i===idx ? "cur" : "todo");
      li.querySelector(".stop").setAttribute("aria-current", i===idx ? "step" : "false");
    });
    $("#v-grade").textContent = state.grade ? state.grade+"학년" : "";
    $("#v-name").textContent = (idx>=1 && state.name) ? state.name : "";
    document.querySelectorAll(".grade").forEach(function(b){ b.classList.toggle("sel", +b.dataset.grade===state.grade); });
    if(step==="student") renderNames();
    if(step==="password"){
      $("#who-plate").textContent = state.grade;
      $("#who-name").textContent = state.name;
      $("#who-grade").textContent = state.grade+"학년";
      resetPw(); pw.focus({preventScroll:true});
    }
  }
  function resetPw(){ pw.value=""; go.disabled=true; box.classList.remove("bad"); msg.className="msg"; pw.removeAttribute("aria-invalid"); }

  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-go],[data-grade],[data-name]");
    if(!t) return;
    if(t.dataset.grade){ state.grade=+t.dataset.grade; state.name=null; show("student"); }
    else if(t.dataset.name){ state.name=t.dataset.name; show("password"); }
    else if(t.dataset.go){ show(t.dataset.go); }
  });
  pw.addEventListener("input", function(){
    go.disabled = !pw.value;
    if(box.classList.contains("bad")){ box.classList.remove("bad"); msg.className="msg"; pw.removeAttribute("aria-invalid"); }
  });
  $("#peek").addEventListener("click", function(){
    var on = pw.type==="password";
    pw.type = on ? "text" : "password";
    this.textContent = on ? "숨기기" : "보기";
    this.setAttribute("aria-pressed", on);
    pw.focus();
  });
  function fail(){
    box.classList.add("bad"); pw.setAttribute("aria-invalid","true");
    msgText.textContent = "비밀번호가 달라요. "+state.name+"의 비밀번호를 다시 입력해 보세요.";
    msg.className = "msg show";
    pw.value=""; go.disabled=true; pw.focus({preventScroll:true});
  }
  $("#pw-form").addEventListener("submit", function(e){
    e.preventDefault();
    if(!pw.value) return;
    if(pw.value==="1234"){
      msgText.textContent = state.name+", 어서 와요! 마켓으로 들어가요.";
      msg.className = "msg show ok"; go.disabled = true;
      setTimeout(function(){ location.href = "student.html"; }, 900);
    } else fail();
  });
  $("#demo-err").addEventListener("click", function(){ show("password"); fail(); });
})();
</script>
</body>
</html>
