<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>곡수마켓 · 들어가기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gothic+A1:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1D2340; --ink-2:#4A5070;
  --blue:#2A55E5; --blue-d:#1F43BF; --blue-l:#DCE5FC;
  --yellow:#FFC83D; --yellow-l:#FFEFC4;
  --tomato:#F26440; --tomato-l:#FDE1D8;
  --ground:#EDF1F7; --card:#FFFFFF;
  --display:"Bagel Fat One","Gothic A1",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --press:120ms cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; font-family:var(--body); color:var(--ink);
  background:var(--blue); line-height:1.5; caret-color:var(--blue); word-break:keep-all; overflow-wrap:anywhere;
  display:flex; flex-direction:column; overflow-x:hidden;
}
::selection{background:var(--yellow); color:var(--ink)}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.on-blue :focus-visible{outline-color:var(--yellow)}
button{font:inherit; color:inherit; cursor:pointer}
.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* awning */
.awning{display:block; width:100%; height:34px; flex:none}

/* stage */
.stage{
  flex:1; width:100%; max-width:1120px; margin:0 auto; padding:40px 24px 24px;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,520px); gap:56px; align-items:center;
}

/* hanging sign */
.sign{color:#fff}
.board{
  position:relative; display:inline-block; margin:0; padding:18px 30px 22px;
  background:var(--yellow); color:var(--ink); border:4px solid var(--ink); border-radius:22px;
  box-shadow:8px 8px 0 var(--ink); transform:rotate(-2.5deg);
  font:400 clamp(3.4rem,7.4vw,6rem)/1 var(--display); letter-spacing:-.01em;
}
.tagline{margin:36px 0 18px; font-size:clamp(1.25rem,2.2vw,1.6rem); font-weight:800; line-height:1.4; text-wrap:balance}
.open{
  position:relative; display:inline-flex; align-items:center; gap:10px; overflow:hidden;
  padding:9px 22px; background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:10px;
  font-weight:800; font-size:.95rem;
}
.open::before,.open::after{
  content:""; position:absolute; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%;
  background:var(--blue); border:3px solid var(--ink);
}
.open::before{left:-10px} .open::after{right:-10px}
.open .dot{width:10px; height:10px; border-radius:50%; background:var(--tomato); border:2px solid var(--ink)}

/* counter card */
.counter{
  background:var(--card); border:4px solid var(--ink); border-radius:26px; box-shadow:10px 10px 0 var(--ink);
  padding:26px 28px 30px; min-width:0;
}
.steps{display:flex; list-style:none; margin:0 0 26px; padding:0; gap:8px}
.steps li{flex:1; min-width:0}
.step{
  width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; min-height:48px;
  background:var(--ground); border:3px solid transparent; border-radius:14px; font-weight:800; font-size:.95rem; color:var(--ink-2);
  transition:background var(--press), border-color var(--press);
}
.step b{
  flex:none; display:grid; place-items:center; width:28px; height:28px; border-radius:50%;
  background:#fff; border:3px solid var(--ink); color:var(--ink); font-size:.85rem; line-height:1;
}
.step b svg{width:14px; height:14px}
.step span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.step:hover{border-color:var(--ink)}
.step[aria-current="step"]{background:var(--yellow); border-color:var(--ink); color:var(--ink)}
.step.done b{background:var(--blue); color:#fff}

.panel h2{margin:0; font:400 1.9rem/1.2 var(--display); letter-spacing:-.01em}
.panel .hint{margin:6px 0 20px; color:var(--ink-2); font-weight:600}
.panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.panel{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}

/* chunky button base */
.chunk{
  border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink);
  transition:transform var(--press), box-shadow var(--press), background var(--press);
}
.chunk:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink)}
.chunk:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}

.grades{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grade{
  min-height:124px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  background:#fff; color:var(--ink);
}
.grade .num{font:400 4rem/1 var(--display)}
.grade .unit{font-weight:800; font-size:1.05rem}
.grade.g3{background:var(--blue); color:#fff}
.grade.g4{background:var(--yellow)}
.grade.g5{background:var(--tomato)}

.back{
  flex:none; display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px;
  background:#fff; font-weight:800; font-size:.9rem; border-radius:12px; box-shadow:3px 3px 0 var(--ink);
}
.back svg{width:18px; height:18px}

.names{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;
  max-height:330px; overflow-y:auto; padding:4px 10px 10px 4px; margin:0 -10px 0 -4px;
  scrollbar-width:thin; scrollbar-color:var(--ink) var(--ground);
}
.names::-webkit-scrollbar{width:10px}
.names::-webkit-scrollbar-track{background:var(--ground); border-radius:10px}
.names::-webkit-scrollbar-thumb{background:var(--ink); border-radius:10px}
.name{min-height:58px; padding:8px; background:#fff; font-weight:800; font-size:1.1rem; border-radius:14px; box-shadow:3px 3px 0 var(--ink)}
.name:hover{background:var(--blue-l)}

.who{
  display:flex; align-items:center; gap:14px; padding:12px 14px; margin:18px 0 22px;
  background:var(--blue-l); border:3px solid var(--ink); border-radius:16px;
}
.avatar{
  flex:none; width:52px; height:52px; display:grid; place-items:center; border-radius:50%;
  background:var(--blue); color:#fff; border:3px solid var(--ink); font:400 1.05rem/1 var(--display);
}
.who p{margin:0; flex:1; min-width:0}
.who .g{display:block; font-size:.85rem; font-weight:600; color:var(--ink-2)}
.who strong{font-size:1.3rem}
.who button{background:none; border:0; padding:8px 4px; font-weight:800; font-size:.9rem; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px}

label.lbl{display:block; font-weight:800; margin-bottom:8px}
.pw{position:relative}
.pw input{
  width:100%; height:66px; padding:0 64px 0 18px; font:800 1.5rem/1 var(--body); letter-spacing:.12em; color:var(--ink);
  background:#fff; border:3px solid var(--ink); border-radius:16px; outline:none;
  transition:border-color var(--press), box-shadow var(--press), background var(--press);
}
.pw input::placeholder{letter-spacing:0; font-size:1.05rem; font-weight:600; color:#6B7090}
.pw input:focus{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-l)}
.pw .eye{
  position:absolute; right:8px; top:50%; transform:translateY(-50%); width:48px; height:48px;
  display:grid; place-items:center; border:0; background:none; border-radius:12px; color:var(--ink);
}
.pw .eye:hover{background:var(--ground)}
.pw .eye svg{width:24px; height:24px}
.invalid .pw input{border-color:var(--tomato); background:var(--tomato-l); box-shadow:none}
.invalid .pw{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.err{
  display:none; gap:10px; align-items:flex-start; margin-top:12px; padding:12px 14px;
  background:var(--tomato-l); border:3px solid var(--ink); border-radius:14px;
}
.err svg{flex:none; width:24px; height:24px; color:var(--tomato); margin-top:1px}
.err p{margin:0; font-size:.95rem; font-weight:600}
.err strong{display:block; font-size:1.05rem; font-weight:800}
.invalid .err{display:flex}

.go{
  width:100%; margin-top:20px; min-height:64px; display:flex; align-items:center; justify-content:center; gap:10px;
  background:var(--blue); color:#fff; font-weight:800; font-size:1.25rem; border-radius:18px; box-shadow:5px 5px 0 var(--ink);
}
.go:hover{background:var(--blue-d)}
.go:active{transform:translate(5px,5px)}
.go:disabled{background:var(--ground); color:#6B7090; border-style:dashed; box-shadow:none; transform:none; cursor:not-allowed}
.go svg{width:22px; height:22px}
.go.loading{pointer-events:none}

/* footer links */
.links{display:flex; justify-content:center; flex-wrap:wrap; gap:14px; padding:8px 24px 18px}
.links a{
  display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:8px 18px;
  background:transparent; color:#fff; font-weight:800; text-decoration:none;
  border:3px solid #fff; border-radius:14px; transition:background var(--press), color var(--press);
}
.links a:hover{background:#fff; color:var(--blue)}
.links svg{width:20px; height:20px}

.demo{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; padding:12px 16px 20px;
  color:#E3EAFD; font-size:.85rem; font-weight:600; border-top:2px dashed rgba(255,255,255,.45);
}
.demo button{
  min-height:36px; padding:4px 12px; border-radius:10px; border:2px solid #E3EAFD; background:transparent; color:#fff; font-weight:800; font-size:.85rem;
}
.demo button:hover{background:#fff; color:var(--blue)}

@media (max-width:860px){
  .stage{grid-template-columns:minmax(0,1fr); gap:28px; padding-top:26px; justify-items:center}
  .sign{text-align:center}
  .board{box-shadow:6px 6px 0 var(--ink)}
  .tagline{margin:26px 0 12px}
  .counter{width:100%; max-width:560px}
}
@media (max-width:480px){
  .stage{padding:18px 16px 16px}
  .counter{padding:20px 16px 22px; border-radius:22px; box-shadow:6px 6px 0 var(--ink)}
  .step{padding:6px; gap:6px; font-size:.85rem}
  .step b{width:24px; height:24px}
  .names{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grade{min-height:104px}
  .grade .num{font-size:3.2rem}
  .panel h2{font-size:1.6rem}
  .open{font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
}
</style>
</head>
<body class="on-blue">

<svg class="awning" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="aw" width="56" height="34" patternUnits="userSpaceOnUse">
      <path d="M1.5 0V18a13 13 0 0 0 26 0V0" fill="#FFC83D" stroke="#1D2340" stroke-width="3"/>
      <path d="M29.5 0V18a13 13 0 0 0 26 0V0" fill="#fff" stroke="#1D2340" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="100%" height="34" fill="url(#aw)"/>
</svg>

<main class="stage">
  <section class="sign" aria-labelledby="brand">
    <h1 id="brand" class="board">곡수마켓</h1>
    <p class="tagline">모은 티켓으로 물건을 사는<br>우리 학교 작은 가게</p>
    <p class="open"><span class="dot" aria-hidden="true"></span>11월 3일 화요일 · 문 열었어요</p>
  </section>

  <section class="counter" aria-label="로그인">
    <ol class="steps" aria-label="들어가는 순서">
      <li><button class="step" type="button" data-go="1"><b>1</b><span>학년</span></button></li>
      <li><button class="step" type="button" data-go="2"><b>2</b><span>이름</span></button></li>
      <li><button class="step" type="button" data-go="3"><b>3</b><span>비밀번호</span></button></li>
    </ol>

    <div class="panel" id="p1">
      <h2>몇 학년이에요?</h2>
      <p class="hint">내 학년을 눌러요.</p>
      <div class="grades">
        <button class="grade chunk g3" type="button" data-grade="3"><span class="num">3</span><span class="unit">학년</span></button>
        <button class="grade chunk g4" type="button" data-grade="4"><span class="num">4</span><span class="unit">학년</span></button>
        <button class="grade chunk g5" type="button" data-grade="5"><span class="num">5</span><span class="unit">학년</span></button>
        <button class="grade chunk g6" type="button" data-grade="6"><span class="num">6</span><span class="unit">학년</span></button>
      </div>
    </div>

    <div class="panel" id="p2" hidden>
      <div class="panel-head">
        <div>
          <h2><span id="gradeLabel">5</span>학년, 이름은?</h2>
          <p class="hint">내 이름을 찾아 눌러요.</p>
        </div>
        <button class="back chunk" type="button" data-go="1">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          학년 바꾸기
        </button>
      </div>
      <div class="names" id="names" role="list"></div>
    </div>

    <form class="panel" id="p3" hidden novalidate>
      <h2>비밀번호를 넣어요</h2>
      <div class="who">
        <span class="avatar" id="avatar" aria-hidden="true">하</span>
        <p><span class="g" id="whoGrade">5학년</span><strong id="whoName">김하늘</strong></p>
        <button type="button" data-go="2">내가 아니에요</button>
      </div>
      <label class="lbl" for="pw">비밀번호</label>
      <div class="pw">
        <input id="pw" type="password" autocomplete="current-password" placeholder="선생님께 받은 비밀번호" aria-describedby="err">
        <button class="eye" type="button" id="eye" aria-label="비밀번호 보기" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="err" id="err" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 7v6" stroke="#fff"/><path d="M12 17h.01" stroke="#fff"/></svg>
        <p><strong>비밀번호가 달라요.</strong>한 글자씩 천천히 다시 넣어 봐요. 잊어버렸으면 선생님께 물어봐요.</p>
      </div>
      <button class="go chunk" id="go" type="submit" disabled>
        들어가기
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>
</main>

<nav class="links" aria-label="다른 페이지">
  <a href="#ranking">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M6 20v-6h4v6"/><path d="M10 20V8h4v12"/><path d="M14 20v-9h4v9"/></svg>
    마켓 랭킹 보기
  </a>
  <a href="admin.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    교사 페이지
  </a>
</nav>

<div class="demo" aria-label="시안 상태 보기">
  <span>시안 상태 보기 (비밀번호 1234만 통과):</span>
  <button type="button" data-go="1">1 학년</button>
  <button type="button" data-go="2">2 이름</button>
  <button type="button" data-go="3">3 비밀번호</button>
  <button type="button" id="demoErr">비밀번호 오류</button>
</div>

<script>
(function(){
  var NAMES = {
    3:["강다온","김로아","박도윤","서이안","송하율","오지호","윤채아","이준우","장소율","정우진","최은호","한별"],
    4:["고은찬","김나린","남궁솔","문태오","박서아","신유찬","안지유","이로운","임하람","최지우","한예린","홍시원"],
    5:["김하늘","김민재","노아린","류건우","박지안","배서윤","윤시우","이다인","장하준","전채원","조은솔","황보람"],
    6:["강서진","구본혁","김예나","도하윤","백승우","손지아","오현서","이서준","정하윤","차민호","최가온","허윤아"]
  };
  var state = {step:1, grade:null, name:null};
  var $ = function(id){ return document.getElementById(id); };
  var panels = [null, $('p1'), $('p2'), $('p3')];
  var steps = document.querySelectorAll('.step');
  var form = document.getElementById('p3');
  var pw = document.getElementById('pw');
  var go = document.getElementById('go');

  function show(n){
    if(n >= 2 && !state.grade) state.grade = 5;
    if(n >= 3 && !state.name){ state.name = NAMES[state.grade][0]; }
    if(n === 2) renderNames();
    if(n === 3) renderWho();
    state.step = n;
    for(var i=1;i<=3;i++){ panels[i].hidden = (i !== n); }
    steps.forEach(function(b, i){
      var k = i+1;
      b.classList.toggle('done', k < n);
      if(k === n) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');
      var label = k===1 ? (state.grade ? state.grade+'학년' : '학년') : k===2 ? (state.name && n>2 ? state.name : '이름') : '비밀번호';
      b.querySelector('span').textContent = label;
      b.querySelector('b').innerHTML = k < n
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
        : String(k);
    });
    if(n === 3){ form.classList.remove('invalid'); setTimeout(function(){ pw.focus(); }, 30); }
  }

  function renderNames(){
    document.getElementById('gradeLabel').textContent = state.grade;
    var box = document.getElementById('names');
    box.innerHTML = '';
    NAMES[state.grade].forEach(function(n){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'name chunk'; b.textContent = n; b.setAttribute('role','listitem');
      b.addEventListener('click', function(){ state.name = n; pw.value=''; go.disabled = true; show(3); });
      box.appendChild(b);
    });
  }
  function renderWho(){
    document.getElementById('whoGrade').textContent = state.grade + '학년';
    document.getElementById('whoName').textContent = state.name;
    document.getElementById('avatar').textContent = state.name.slice(-2);
  }

  document.querySelectorAll('[data-grade]').forEach(function(b){
    b.addEventListener('click', function(){ state.grade = +b.dataset.grade; state.name = null; show(2); });
  });
  document.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click', function(){ show(+b.dataset.go); });
  });

  pw.addEventListener('input', function(){
    go.disabled = !pw.value;
    form.classList.remove('invalid');
    pw.removeAttribute('aria-invalid');
  });
  document.getElementById('eye').addEventListener('click', function(){
    var on = pw.type === 'password';
    pw.type = on ? 'text' : 'password';
    this.setAttribute('aria-pressed', on);
    this.setAttribute('aria-label', on ? '비밀번호 숨기기' : '비밀번호 보기');
  });

  function fail(){
    form.classList.remove('invalid'); void form.offsetWidth;
    form.classList.add('invalid'); pw.setAttribute('aria-invalid','true');
    pw.select();
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(!pw.value) return;
    if(pw.value === '1234'){
      go.classList.add('loading'); go.firstChild.textContent = '들어가는 중… ';
      setTimeout(function(){ location.href = 'student.html'; }, 500);
    } else { fail(); }
  });
  document.getElementById('demoErr').addEventListener('click', function(){
    show(3); pw.value = 'haneul'; go.disabled = false; fail();
  });

  show(1);
})();
</script>
</body>
</html>
