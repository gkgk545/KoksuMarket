.frame{display:flex;flex-direction:column;flex:1 1 0;min-width:0;max-width:100%}
.frame .cap{font-size:13px;color:var(--muted);margin:0 0 6px}
.frame .cap b{color:var(--ink)}

.w-tablet .frame{flex:0 0 820px}
.w-mobile .frame{flex:0 0 390px}
.side .frame{flex:1 1 0;min-width:360px}
.side.w-tablet .frame{flex:0 0 820px}
.side.w-mobile .frame{flex:0 0 390px}
@media (max-width:700px){main{padding:8px}.w-tablet .frame,.side .frame{flex:0 0 100%}}
</style>
</head>

6px 0 10px}\n.sum .total dd{font:400 30px/1 var(--display)}\n.sum .after dd{font-weight:800;color:var(--ink)}\n.sum .after.neg dd{color:var(--stamp)}\n.d-foot{padding:16px 20px 20px;border-top:1.5px solid var(--rule);background:var(--ground)}\n.d-foot .btn{width:100%;height:56px;font-size:18px}\n.d-foot .btn:disabled{background:var(--paper-2);color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--rule)}\n.d-note{margin:10px 0 0;font-size:14px;color:var(--ink-2);text-align:center}\n.d-note.bad{color:var(--stamp);font-weight:700}\n.d-done{margin:0 0 14px;font-size:15px;color:var(--ink-2);text-align:center}\n.d-done b{color:var(--done)}\n.empty{text-align:center;padding:28px 8px 16px}\n.empty b{display:block;font:800 17px/1.4 var(--ui);margin-bottom:6px}\n.empty p{margin:0;color:var(--ink-2);font-size:15px}\n.paid{\n  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-8deg);\n  font:400 40px/1 var(--display);color:var(--done);border:3.5px solid var(--done);outline:1.5px solid var(--done);outline-offset:4px;\n  padding:10px 18px 8px;border-radius:8px;mix-blend-mode:multiply;white-space:nowrap;pointer-events:none;\n  animation:thunk .34s cubic-bezier(.2,1.4,.4,1) both;\n}\n@keyframes thunk{from{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(1.6)}to{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}}\n\n.toast{\n  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:50;background:var(--ink);color:var(--paper);\n  padding:12px 18px;border-radius:var(--r);font-weight:700;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);\n  max-width:calc(100% - 32px);\n}\n.toast.on{opacity:1;transform:translate(-50%,0)}\n\n@media (max-width:860px){\n  .wrap{padding:0 16px}\n  .top-in{gap:8px 12px;padding-top:10px;padding-bottom:4px}\n  .logo{font-size:26px}\n  .me{order:5;flex:1}\n  .purse{order:2;margin-left:auto;padding:5px 12px 5px 10px}\n  .purse small{display:none}\n  .a " stroke-width=\"2.2\" stroke-linecap=\"round\"/><\/symbol>\n  <symbol id=\"i-warn\" viewBox=\"0 0 24 24\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3.5L2.8 19.5h18.4z\"/><path d=\"M12 10v4.2M12 17v.2\"/><\/g><\/symbol>\n<\/svg>\n\n<div id=\"app\">\n<header class=\"top\">\n  <div class=\"wrap top-in\">\n    <a class=\"logo\" href=\"main.html\">곡수마켓<\/a>\n    <p class=\"me\" style=\"margin:0\"><span>5학년<\/span>김하늘<\/p>\n    <div class=\"purse\" aria-label=\"보유 티켓\"><small>보유 티켓<\/small><b id=\"bal\">12<\/b><span>장<\/span><\/div>\n    <div class=\"acts\">\n      <a class=\"hbtn\" href=\"#history\" aria-label=\"구매 기록\"><svg class=\"i\"><use href=\"#i-receipt\"/><\/svg><span class=\"lbl\">구매 기록<\/span><\/a>\n      <button class=\"hbtn cart\" id=\"openCart\" type=\"button\" aria-label=\"장바구니 열기\"><svg class=\"i\"><use href=\"#i-cart\"/><\/svg><span class=\"lbl\">장바구니<\/span><span class=\"count\" id=\"cnt\">3<\/span><\/button>\n      <a class=\"hbtn\" href=\"main.html\" aria-label=\"로그아웃\"><svg class=\"i\"><use href=\"#i-out\"/><\/svg><span class=\"lbl\">로그아웃<\/span><\/a>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main class=\"wrap\">\n  <nav class=\"tabs\" aria-label=\"마켓 메뉴\">\n    <a href=\"#items\" aria-current=\"page\">상품 목록<\/a>\n    <a href=\"#funding\">공동 펀딩<\/a>\n    <a href=\"#ranking\">마켓 랭킹<\/a>\n  <\/nav>\n\n  <section class=\"fund\" aria-labelledby=\"fund-t\">\n    <div>\n      <h2 id=\"fund-t\"><span>공동 펀딩<\/span>우리 반 보드게임 ‘루미큐브’ 함께 사기<\/h2>\n      <p>11월 13일(금)까지 · 10일 남음 · 23명 참여<\/p>\n    <\/div>\n    <a class=\"btn ghost\" href=\"#funding\">펀딩 보러 가기<\/a>\n    <div class=\"strip\">\n      <div class=\"cells\" id=\"cells\" role=\"img\" aria-label=\"목표 200장 중 128장 모임\"><\/div>\n      <b>128<small>/ 200장<\/small><\/b>\n    <\/div>\n  <\/section>\n\n  <div class=\"shelf-h\">\n    <h1 id=\"items\">판매 중인 물건<\/h1>\n    <p id=\"shelf-sub\">8가지<\/p>\n  <\/div>\n  <div class=\"grid\" id=\"grid\"><\/div>\n<\/main>\n\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<aside class=\"drawer\" id=\"drawer\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"d-t\" tabindex=\"-1\">\n  <div class=\"d-head\"><h2 id=\"d-t\">장바구니<\/h2><button class=\"x\" type=\"button\" id=\"closeCart\" aria-label=\"장바구니 닫기\"><svg class=\"i\"><use href=\"#i-x\"/><\/svg><\/button><\/div>\n  <div class=\"d-body\"><div class=\"receipt\" id=\"receipt\"><\/div><\/div>\n  <div class=\"d-foot\" id=\"dfoot\"><\/div>\n<\/aside>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<\/div>\n\n<script>\n(function(){\n  var items=[\n    {id:1,name:\"연필 세트\",unit:\"4자루\",cat:\"학용품\",word:\"연필\",c:\"sky\",cost:3,qty:14},\n    {id:2,name:\"간식 쿠폰\",unit:\"매점 과자 1개\",cat:\"간식\",word:\"간식\",c:\"apricot\",cost:5,qty:3},\n    {id:3,name:\"자리 바꾸기권\",unit:\"1주일\",cat:\"권리\",word:\"자리\",c:\"mint\",cost:8,qty:6},\n    {id:4,name:\"급식 먼저 먹기권\",unit:\"하루\",cat:\"권리\",word:\"급식\",c:\"mint\",cost:10,qty:0},\n    {id:5,name:\"캐릭터 스티커\",unit:\"1장\",cat:\"학용품\",word:\"스티커\",c:\"sky\",cost:2,qty:25},\n    {id:6,name:\"보드게임 30분 이용권\",unit:\"점심시간\",cat:\"놀이\",word:\"보드게임\",c:\"sand\",cost:15,qty:4,link:true},\n    {id:7,name:\"점심 노래 선곡권\",unit:\"1곡\",cat:\"놀이\",word:\"선곡\",c:\"sand\",cost:6,qty:1},\n    {id:8,name:\"칭찬 도장 두 배권\",unit:\"하루\",cat:\"권리\",word:\"도장\",c:\"mint\",cost:20,qty:5}\n  ];\n  var bal=12, cart={1:1,5:2}, paid=false;\n  var $=function(id){return document.getElementById(id)};\n  var byId=function(id){return items.filter(function(i){return i.id==id})[0]};\n  var ic=function(n){return '<svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-'+n+'\"/><\/svg>'};\n\n  // funding strip: 20 cells x 10장\n  (function(){var h=\"\",got=128;for(var k=0;k<20;k++){var lo=k*10;if(got>=lo+10)h+='<i class=\"f\"><\/i>';else if(got>lo)h+='<i class=\"p\" style=\"--w:'+((got-lo)*10)+'%\"><\/i>';else h+=\"<i><\/i>\"}$(\"cells\").innerHTML=h})();\n\n  function cartTotal(){var t=0;for(var k in cart)t+=byId(k).cost*cart[k];return t}\n  function cartCount(){var n=0;for(var k in cart)n+=cart[k];return n}\n\n  function card(it){\n    var inCart=cart[it.id]||0, out=it.qty<=0, low=!out&&it.qty<=3, short=!out&&bal<it.cost;\n    var st=out?\"out\":short?\"short\":\"ok\";\n    var face='<div class=\"face c-'+it.c+'\"><span class=\"cat\">'+it.cat+'<\/span><span class=\"word\" aria-hidden=\"true\">'+it.word+'<\/span>'+\n      (out?'<span class=\"stampmark\">품절<\/span>':'')+\n      (low?'<span class=\"low-tag\">'+ic(\"warn\")+'품절 임박<\/span>':'')+'<\/div>';\n    var meta=out?'<span>다음 입고를 기다려요<\/span>':\n      (low?'<span class=\"warn\">'+it.qty+'개 남음<\/span>':'<span>재고 '+it.qty+'개<\/span>')+'<span>'+it.unit+'<\/span>';\n    var act;\n    if(out) act='<button class=\"btn\" type=\"button\" disabled>품절<\/button>';\n    else if(inCart) act='<div class=\"step\" role=\"group\" aria-label=\"'+it.name+' 개수\"><button type=\"button\" data-dec=\"'+it.id+'\" aria-label=\"하나 빼기\">'+ic(\"minus\")+'<\/button><output>'+inCart+'<\/output><button type=\"button\" data-inc=\"'+it.id+'\" aria-label=\"하나 더 담기\"'+(inCart>=it.qty?' disabled':'')+'>'+ic(\"plus\")+'<\/button><\/div>';\n    else if(short) act='<button class=\"btn\" type=\"button\" disabled>티켓 '+(it.cost-bal)+'장 부족<\/button>';\n    else act='<button class=\"btn\" type=\"button\" data-add=\"'+it.id+'\">담기<\/button>';\n    return '<div class=\"tw\"><article class=\"tk '+st+'\" aria-label=\"'+it.name+', '+it.cost+'장\">'+face+\n      '<div class=\"info\"><h3>'+it.name+'<\/h3><p class=\"meta\">'+meta+'<\/p>'+\n      (it.link?'<a class=\"more\" href=\"#detail\">자세히 보기<\/a>':'')+'<\/div>'+\n      '<div class=\"stub\"><p class=\"price\"><b>'+it.cost+'<\/b><span>장<\/span><\/p>'+act+'<\/div><\/article><\/div>';\n  }\n  function renderGrid(){\n    $(\"grid\").innerHTML=items.map(card).join(\"\");\n    var can=items.filter(function(i){return i.qty>0&&bal>=i.cost}).length;\n    $(\"shelf-sub\").textContent=\"8가지 중 지금 \"+can+\"가지를 살 수 있어 " data-go=\"student\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M20 12H5M11 6l-6 6 6 6\"/><\/svg>내 이름이 아니에요<\/button>\n      <\/div>\n      <form id=\"pw-form\" novalidate>\n        <label class=\"field\" for=\"pw\">비밀번호<\/label>\n        <div class=\"pw\" id=\"pw-box\">\n          <input id=\"pw\" type=\"password\" autocomplete=\"current-password\" placeholder=\"선생님께 받은 비밀번호\" aria-describedby=\"pw-msg\">\n          <button class=\"peek\" type=\"button\" id=\"peek\" aria-pressed=\"false\">보기<\/button>\n        <\/div>\n        <p class=\"msg\" id=\"pw-msg\" role=\"alert\" aria-live=\"assertive\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9.5\"/><path d=\"M12 7v6M12 16.5v.5\" stroke-linecap=\"square\"/><\/svg>\n          <span id=\"pw-msg-text\">비밀번호가 달라요. 다시 입력해 보세요.<\/span>\n        <\/p>\n        <button class=\"go\" type=\"submit\" id=\"go\" disabled>\n          마켓 들어가기\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"/><\/svg>\n        <\/button>\n        <p class=\"hint\">비밀번호를 잊었으면 선생님께 말해 주세요.<\/p>\n      <\/form>\n    <\/section>\n\n    <p class=\"demo\" aria-label=\"시안 확인용\">\n      <span>시안 확인용: 비밀번호 1234는 성공, 다른 값은 오류 화면이에요.<\/span>\n      <button type=\"button\" id=\"demo-err\">오류 화면 바로 보기<\/button>\n    <\/p>\n  <\/main>\n<\/div>\n\n<script>\n(function(){\n  var roster = {\n    3:[\"강도하\",\"김로아\",\"나윤슬\",\"문지온\",\"박이안\",\"배시아\",\"서하준\",\"송다올\",\"신채아\",\"오이준\",\"유은호\",\"이소율\"],\n    4:[\"고은찬\",\"김나래\",\"김태오\",\"노하윤\",\"류시후\",\"민서윤\",\"박건\",\"손하엘\",\"안지유\",\"윤재민\",\"전보민\",\"조아린\",\"최온유\",\"홍라희\"],\n    5:[\"김하늘\",\"박서준\",\"이도윤\",\"최지아\",\"정하린\",\"강시우\",\"조유나\",\"윤지호\",\"장서아\",\"임건우\",\"한예린\",\"오준서\",\"서다은\",\"신우진\",\"권나윤\",\"황민재\"],\n    6:[\"구민결\",\"김세아\",\"남도현\",\"문하람\",\"박지율\",\"백승아\",\"성우빈\",\"양서진\",\"엄태린\",\"이주원\",\"정나은\",\"차윤호\",\"하지민\"]\n  };\n  var state = {step:\"grade\", grade:null, name:null};\n  var order = [\"grade\",\"student\",\"password\"];\n  var $ = function(s){return document.querySelector(s)};\n  var pw = $(\"#pw\"), go = $(\"#go\"), box = $(\"#pw-box\"), msg = $(\"#pw-msg\"), msgText = $(\"#pw-msg-text\");\n\n  function renderNames(){\n    var list = roster[state.grade] || [];\n    $(\"#names\").innerHTML = list.map(function(n,i){\n      return '<button type=\"button\" class=\"name'+(n===state.name?' sel':'')+'\" data-name=\"'+n+'\"><i class=\"num\">'+(i+1)+'<\/i>'+n+'<\/button>';\n    }).join(\"\");\n  }\n  function show(step){\n    // fill sample values when jumping ahead from the route strip\n    if(step!==\"grade\" && !state.grade) state.grade = 5;\n    if(step===\"password\" && !state.name) state.name = roster[state.grade][0];\n    state.step = step;\n    order.forEach(function(s){\n      var p = $(\"#p-\"+s); var on = s===step;\n      p.hidden = !on;\n      if(on){ p.classList.remove(\"step-in\"); void p.offsetWidth; p.classList.add(\"step-in\"); }\n    });\n    var idx = order.indexOf(step);\n    document.querySelectorAll(\".route li\").forEach(function(li,i){\n      li.className = i<idx ? \"done\" : (i===idx ? \"cur\" : \"todo\");\n      li.querySelector(\".stop\").setAttribute(\"aria-current\", i===idx ? \"step\" : \"false\");\n    });\n    $(\"#v-grade\").textContent = state.grade ? state.grade+\"학년\" : \"\";\n    $(\"#v-name\").textContent = (idx>=1 && state.name) ? state.name : \"\";\n    document.querySelectorAll(\".grade\").forEach(function(b){ b.classList.toggle(\"sel\", +b.dataset.grade===state.grade); });\n    if(step===\"student\") renderNames();\n    if(step===\"password\"){\n      $(\"#who-plate\").textContent = state.grade;\n      $(\"#who-name\").textContent = state.name;\n      $(\"#who-grade\").textContent = state.grade+\"학년\";\n      resetPw(); pw.focus({preventScroll:true});\n    }\n  }\n  function resetPw(){ pw.value=\"\"; go.disabled=true; box.classList.remove(\"bad\"); msg.className=\"msg\"; pw.removeAttribute(\"aria-invalid\"); }\n\n  document.addEventListener(\"click\", function(e){\n    var t = e.target.closest(\"[data-go],[data-grade],[data-name]\");\n    if(!t) return;\n    if(t.dataset.grade){ state.grade=+t.dataset.grade; state.name=null; show(\"student\"); }\n    else if(t.dataset.name){ state.name=t.dataset.name; show(\"password\"); }\n    else if(t.dataset.go){ show(t.dataset.go); }\n  });\n  pw.addEventListener(\"input\", function(){\n    go.disabled = !pw.value;\n    if(box.classList.contains(\"bad\")){ box.classList.remove(\"bad\"); msg.className=\"msg\"; pw.removeAttribute(\"aria-invalid\"); }\n  });\n  $(\"#peek\").addEventListener(\"click\", function(){\n    var on = pw.type===\"password\";\n    pw.type = on ? \"text\" : \"password\";\n    this.textContent = on ? \"숨기기\" : \"보기\";\n    this.setAttribute(\"aria-pressed\", on);\n    pw.focus();\n  });\n  function fail(){\n    box.classList.add(\"bad\"); pw.setAttribute(\"aria-invalid\",\"true\");\n    msgText.textContent = \"비밀번호가 달라요. \"+state.name+\"의 비밀번호를 다시 입력해 보세요.\";\n    msg.className = \"msg show\";\n    pw.value=\"\"; go.disabled=true; pw.focus({preventScroll:true});\n  }\n  $(\"#pw-form\").addEventListener(\"submit\", function(e){\n    e.preventDefault();\n    if(!pw.value) return;\n    if(pw.value===\"1234\"){\n      msgText.textContent = state.name+\", 어서 와요! 마켓으로 들어가요.\";\n      msg.className = \"msg show ok\"; go.disabled = true;\n      setTimeout(function(){ location.href = \"student.html\"; }, 900);\n    } else fail();\n  });\n  $(\"#demo-err\").addEventListener(\"click\", function(){ show(\"password\"); fail(); });\n})();\n<\/script>\n<\/body>\n<\/html>\n","b-student":"<!doctype html>\n<html lang=\"ko\">\n<head><base href=\"b/\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>곡수마켓 · 상품 목록<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Gothic+A1:wght@400;500;700;800;900&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink:#121418; --ink-2:#3d424a; --mute:#646a73;\n  --paper:#eceee9; --card:#ffffff; --line:#c9ccc5; --dim:#d9dbd5;\n  --sig:#ffc21a; --sig-press:#f0b000; --sig-soft:#fff3cc;\n  --err:#c4231b; --err-bg:#fdecea;\n  --rule:4px;\n  --num:\"Barlow\",\"Gothic A1\",sans-serif;\n  --kr:\"Gothic A1\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;\n  --ease:cubic-bezier(.16,1,.3,1);\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{-webkit-text-size-adjust:100%}\nbody{font-family:var(--kr);color:var(--ink);background:var(--paper);font-size:16px;line-height:1.5;word-break:keep-all;min-height:100vh}\nbody.locked{overflow:hidden}\n::selection{background:var(--sig);color:var(--ink)}\nbutton{font:inherit;color:inherit;cursor:pointer;background:none;border:0}\na{color:inherit}\n:focus-visible{outline:3px solid var(--ink);outline-offset:3px}\n.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums}\n.wrap{max-width:1280px;margin:0 auto;padding:0 32px}\n.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}\n\n/* ---------- top bar ---------- */\n.top{background:var(--ink);color:#fff}\n.top .wrap{display:flex;align-items:stretch;gap:24px;min-height:84px}\n.top :focus-visible{outline-color:var(--sig)}\n.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}\n.brand-plate{width:44px;height:44px;background:var(--sig);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:25px;line-height:1}\n.brand-word{font-weight:900;font-size:24px;l yle=\"width:'+Math.round(x.t/maxT*100)+'%\"><\/i><\/span><\/td>'+\n      '<td class=\"r avg avg-c\">'+Math.round(x.t/x.n)+'장<\/td><\/tr>';\n  }).join(\"\");\n\n  function left(g){ return pend.filter(function(p){ return !done[p.id] && (!g || p.g===g); }).length; }\n  function renderSeg(){\n    var opts = [0,3,4,5,6];\n    $(\"#seg\").innerHTML = opts.map(function(g){\n      return '<button type=\"button\" data-f=\"'+g+'\" aria-pressed=\"'+(filter===g)+'\">'+(g?g+'학년':'전체')+' <span class=\"num\">'+left(g)+'<\/span><\/button>';\n    }).join(\"\");\n  }\n  var check = '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"square\" aria-hidden=\"true\"><path d=\"M4 12.5l5 5L20 6.5\"/><\/svg>';\n  function renderRows(){\n    var rows = pend.filter(function(p){ return !filter || p.g===filter; });\n    if(!rows.length || rows.every(function(p){return done[p.id]}) && !rows.some(function(p){return done[p.id]===\"recent\"})){\n      $(\"#pend-body\").innerHTML = '<tr><td colspan=\"5\" class=\"nothing\"><b>전달할 물건이 없어요<\/b><p>'+(filter?filter+'학년은 모두 전달했어요. ':'')+'새 구매가 들어오면 여기에 바로 나타나요.<\/p><\/td><\/tr>';\n      return;\n    }\n    $(\"#pend-body\").innerHTML = rows.filter(function(p){ return !done[p.id] || done[p.id]===\"recent\"; }).map(function(p){\n      var gone = !!done[p.id];\n      return '<tr'+(gone?' class=\"gone\"':'')+'>'+\n        '<td class=\"t\"><span class=\"time\">'+p.time+'<small>'+(p.day===\"어제\"?'<span class=\"old\">어제<\/span>':'오늘')+'<\/small><\/span><\/td>'+\n        '<td class=\"w\"><span class=\"who\"><span class=\"plate\" aria-hidden=\"true\">'+p.g+'<\/span>'+p.who+'<span class=\"sr\">, '+p.g+'학년<\/span><\/span><\/td>'+\n        '<td class=\"i\"><span class=\"what\">'+p.what+'<\/span><\/td>'+\n        '<td class=\"q r\"><span class=\"qty\">×'+p.q+'<\/span><\/td>'+\n        '<td class=\"a r\">'+(gone\n          ? '<span class=\"undo-wrap\">'+check+'전달함<button class=\"undo\" type=\"button\" data-undo=\"'+p.id+'\">되돌리기<\/button><\/span>'\n          : '<button class=\"give\" type=\"button\" data-give=\"'+p.id+'\" aria-label=\"'+p.who+'에게 '+p.what+' 전달 완료\">'+check+'전달 완료<\/button>')+'<\/td><\/tr>';\n    }).join(\"\");\n  }\n  function renderCount(){\n    var n = left(0);\n    $(\"#pend-num\").innerHTML = n+'<small>건<\/small>';\n    $(\"#pend-title-n\").textContent = n;\n    $(\"#pend-cell\").classList.toggle(\"clear\", n===0);\n    $(\"#pend-link\").firstChild.textContent = n ? \"아래 목록에서 처리 \" : \"모두 전달했어요 \";\n  }\n  function all(){ renderSeg(); renderRows(); renderCount(); }\n  function toast(msg){\n    var t = $(\"#toast\"); t.textContent = msg; t.classList.add(\"on\");\n    clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove(\"on\"); }, 2200);\n  }\n  document.addEventListener(\"click\", function(e){\n    var b = e.target.closest(\"button\"); if(!b) return;\n    if(b.dataset.give){\n      var id = +b.dataset.give, p = pend.filter(function(x){return x.id===id})[0];\n      done[id] = \"recent\"; all(); toast(p.who+\" · \"+p.what+\" 전달 완료\");\n      var u = document.querySelector('[data-undo=\"'+id+'\"]'); if(u) u.focus();\n      setTimeout(function(){ if(done[id]===\"recent\"){ done[id]=true; renderRows(); } }, 6000);\n    } else if(b.dataset.undo){\n      delete done[+b.dataset.undo]; all();\n      var g = document.querySelector('[data-give=\"'+b.dataset.undo+'\"]'); if(g) g.focus();\n    } else if(b.dataset.f !== undefined){\n      filter = +b.dataset.f; all();\n    }\n  });\n  all();\n})();\n<\/script>\n<\/body>\n<\/html>\n","c-main":"<!doctype html>\n<html lang=\"ko\">\n<head><base href=\"c/\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>곡수마켓 · 들어가기<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gothic+A1:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink:#1D2340; --ink-2:#4A5070;\n  --blue:#2A55E5; --blue-d:#1F43BF; --blue-l:#DCE5FC;\n  --yellow:#FFC83D; --yellow-l:#FFEFC4;\n  --tomato:#F26440; --tomato-l:#FDE1D8;\n  --ground:#EDF1F7; --card:#FFFFFF;\n  --display:\"Bagel Fat One\",\"Gothic A1\",sans-serif;\n  --body:\"Gothic A1\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;\n  --press:120ms cubic-bezier(.2,.8,.2,1);\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{\n  margin:0; min-height:100vh; font-family:var(--body); color:var(--ink);\n  background:var(--blue); line-height:1.5; caret-color:var(--blue); word-break:keep-all; overflow-wrap:anywhere;\n  display:flex; flex-direction:column; overflow-x:hidden;\n}\n::selection{background:var(--yellow); color:var(--ink)}\n:focus-visible{outline:3px solid var(--ink); outline-offset:3px}\n.on-blue :focus-visible{outline-color:var(--yellow)}\nbutton{font:inherit; color:inherit; cursor:pointer}\n.sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}\n\n/* awning */\n.awning{display:block; width:100%; height:34px; flex:none}\n\n/* stage */\n.stage{\n  flex:1; width:100%; max-width:1120px; margin:0 auto; padding:40px 24px 24px;\n  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,520px); gap:56px; align-items:center;\n}\n\n/* hanging sign */\n.sign{color:#fff}\n.board{\n  position:relative; display:inline-block; margin:0; padding:18px 30px 22px;\n  background:var(--yellow); color:var(--ink); border:4px solid var(--ink); border-radius:22px;\n  box-shadow:8px 8px 0 var(--ink); transform:rotate(-2.5deg);\n  font:400 clamp(3.4rem,7.4vw,6rem)/1 var(--display); letter-spacing:-.01em;\n}\n.tagline{margin:36px 0 18px; font-size:clamp(1.25rem,2.2vw,1.6rem); font-weight:800; line-height:1.4; text-wrap:balance}\n.open{\n  position:relative; display:inline-flex; align-items:center; gap:10px; overflow:hidden;\n  padding:9px 22px; background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:10px;\n  font-weight:800; font-size:.95rem;\n}\n.open::before,.open::after{\n  content:\"\"; position:absolute; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%;\n  background:var(--blue); border:3px solid var(--ink);\n}\n.open::before{left:-10px} .open::after{right:-10px}\n.open .dot{width:10px; height:10px; border-radius:50%; background:var(--tomato); border:2px solid var(--ink)}\n\n/* counter card */\n.counter{\n  background:var(--card); border:4px solid var(--ink); border-radius:26px; box-shadow:10px 10px 0 var(--ink);\n  padding:26px 28px 30px; min-width:0;\n}\n.steps{display:flex; list-style:none; margin:0 0 26px; padding:0; gap:8px}\n.steps li{flex:1; min-width:0}\n.step{\n  width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; min-height:48px;\n  background:var(--ground); border:3px solid transparent; border-radius:14px; font-weight:800; font-size:.95rem; color:var(--ink-2);\n  transition:background var(--press), border-color var(--press);\n}\n.step b{\n  flex:none; display:grid; place-items:center; width:28px; height:28px; border-radius:50%;\n  background:#fff; border:3px solid var(--ink); color:var(--ink); font-size:.85rem; line-height:1;\n}\n.step b svg{width:14px; height:14px}\n.step span{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}\n.step:hover{border-color:var(--ink)}\n.step[aria-current=\"step\"]{background:var(--yellow); border-color:var(--ink); color:var(--ink)}\n.step.done b{background:var(--blue); color:#fff}\n\n.panel h2{margin:0; font:400 1.9rem/1.2 var(--display); letter-spacing:-.01em}\n.panel .hint{margin:6px 0 20px; color:var(--ink-2); font-weight:600}\n.panel-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}\n.panel{animation:slide .22s cubic-bezier(.2,.8,.2,1)}\n@keyframes slide{from{opacity:0; transform:translateX(14px)}to{opacity:1; transform:none}}\n\n/* chunky button base */\n.chunk{\n  border:3px solid var(--ink); border-radius:16px; box-shadow:4px 4px 0 var(--ink);\n  transition:transform var(--press), box-shadow var(--press), background var(--press);\n}\n.chunk:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink)}\n.chunk:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}\n\n.grades{display:grid; grid-template-columns:1fr 1fr; gap:16px}\n.grade{\n  min-height:124px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;\n  background:#fff; color:var(--ink);\n}\n.grade .num{font:400 4rem/1 var(--display)}\n.grade .unit{font-weight:800; font-size:1.05rem}\n.grade.g3{background:var(--blue); color:#fff}\n.grade.g4{background:var(--yellow)}\n.grade.g5{background:var(--tomato)}\n\n.back{\n  flex:none; display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px;\n  background:#fff; font-weight:800; font-size:.9rem; border-radius:12px; box-shadow:3px 3px 0 var(--ink);\n}\n.back svg{width:18px; height:18px}\n\n.names{\n  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;\n  max-height:330px; overflow-y:auto; padding:4px 10px 10px 4px; margin:0 -10px 0 -4px;\n  scrollbar-width:thin; scrollbar-color:var(--ink) var(--ground);\n}\n.names::-webkit-scrollbar{width:10px}\n.names::-webkit-scrollbar-track{background:var(--ground); border-radius:10px}\n.names::-webkit-scrollbar-thumb{background:var(--ink); border-radius:10px}\n.name{min-height:58px; padding:8px; background:#fff; font-weight:800; font-size:1.1rem; border-radius:14px; box-shadow:3px 3px 0 var(--ink)}\n.name:hover{background:var(--blue-l)}\n\n.who{\n  display:flex; align-items:center; gap:14px; padding:12px 14px; margin:18px 0 22px;\n  background:var(--blue-l); border:3px solid var(--ink); border-radius:16px;\n}\n.avatar{\n  flex:none; width:52px; height:52px; display:grid; place-items:center; border-radius:50%;\n  background:var(--blue); color:#fff; border:3px solid var(--ink); font:400 1.05rem/1 var(--display);\n}\n.who p{margin:0; flex:1; min-width:0}\n.who .g{display:block; font-size:.85rem; font-weight:600; color:var(--ink-2)}\n.who strong{font-size:1.3rem}\n.who button{background:none; border:0; padding:8px 4px; font-weight:800; font-size:.9rem; text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:2px}\n\nlabel.lbl{display:block; font-weight:800; margin-bottom:8px}\n.pw{position:relative}\n.pw input{\n  width:100%; height:66px; padding:0 64px 0 18px; font:800 1.5rem/1 var(--body); letter-spacing:.12em; color:var(--ink);\n  background:#fff; border:3px solid var(--ink); border-radius:16px; outline:none;\n  transition:border-color var(--press), box-shadow var(--press), background var(--press);\n}\n.pw input::placeholder{letter-spacing:0; font-size:1.05rem; font-weight:600; color:#6B7090}\n.pw input:focus{border-color:var(--blue); box-shadow:0 0 0 4px var(--blue-l)}\n.pw .eye{\n  position:absolute; right:8px; top:50%; transform:translateY(-50%); width:48px; height:48px;\n  display:grid; place-items:center; border:0; background:none; border-radius:12px; color:var(--ink);\n}\n.pw .eye:hover{background:var(--ground)}\n.pw .eye svg{width:24px; height:24px}\n.invalid .pw input{border-color:var(--tomato); background:var(--tomato-l); box-shadow:none}\n.invalid .pw{animation:shake .32s}\n@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}\n.err{\n  display:none; gap:10px; align-items:flex-start; margin-top:12px; padding:12px 14px;\n  background:var(--tomato-l); border:3px solid var(--ink); border-radius:14px;\n}\n.err svg{flex:none; width:24px; height:24px; color:var(--tomato); margin-top:1px}\n.err p{margin:0; font-size:.95rem; font-weight:600}\n.err strong{display:block; font-size:1.05rem; font-weight:800}\n.invalid .err{display:flex}\n\n.go{\n  width:100%; margin-top:20px; min-height:64px; display:flex; align-items:center; justify-content:center; gap:10px;\n  background:var(--blue); color:#fff; font-weight:800; font-size:1.25rem; border-radius:18px; box-shadow:5px 5px 0 var(--ink);\n}\n.go:hover{background:var(--blue-d)}\n.go:active{transform:translate(5px,5px)}\n.go:disabled{background:var(--ground); color:#6B7090; border-style:dashed; box-shadow:none; transform:none; cursor:not-allowed}\n.go svg{width:22px; height:22px}\n.go.loading{pointer-events:none}\n\n/* footer links */\n.links{display:flex; justify-content:center; flex-wrap:wrap; gap:14px; padding:8px 24px 18px}\n.links a{\n  display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:8px 18px;\n  background:transparent; color:#fff; font-weight:800; text-decoration:none;\n  border:3px solid #fff; border-radius:14px; transition:background var(--press), color var(--press);\n}\n.links a:hover{background:#fff; color:var(--blue)}\n.links svg{width:20px; height:20px}\n\n.demo{\n  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; padding:12px 16px 20px;\n  color:#E3EAFD; font-size:.85rem; font-weight:600; border-top:2px dashed rgba(255,255,255,.45);\n}\n.demo button{\n  min-height:36px; padding:4px 12px; border-radius:10px; border:2px solid #E3EAFD; background:transparent; color:#fff; font-weight:800; font-size:.85rem;\n}\n.demo button:hover{background:#fff; color:var(--blue)}\n\n@media (max-width:860px){\n  .stage{grid-template-columns:minmax(0,1fr); gap:28px; padding-top:26px; justify-items:center}\n  .sign{text-align:center}\n  .board{box-shadow:6px 6px 0 var(--ink)}\n  .tagline{margin:26px 0 12px}\n  .counter{width:100%; max-width:560px}\n}\n@media (max-width:480px){\n  .stage{padding:18px 16px 16px}\n  .counter{padding:20px 16px 22px; border-radius:22px; box-shadow:6px 6px 0 var(--ink)}\n  .step{padding:6px; gap:6px; font-size:.85rem}\n  .step b{width:24px; height:24px}\n  .names{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .grade{min-height:104px}\n  .grade .num{font-size:3.2rem}\n  .panel h2{font-size:1.6rem}\n  .open{font-size:.85rem}\n}\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important; transition:none!important}\n}\n<\/style>\n<\/head>\n<body class=\"on-blue\">\n\n<svg class=\"awning\" aria-hidden=\"true\" focusable=\"false\">\n  <defs>\n    <pattern id=\"aw\" width=\"56\" height=\"34\" patternUnits=\"userSpaceOnUse\">\n      <path d=\"M1.5 0V18a13 13 0 0 0 26 0V0\" fill=\"#FFC83D\" stroke=\"#1D2340\" stroke-width=\"3\"/>\n      <path d=\"M29.5 0V18a13 13 0 0 0 26 0V0\" fill=\"#fff\" stroke=\"#1D2340\" stroke-width=\"3\"/>\n    <\/pattern>\n  <\/defs>\n  <rect width=\"100%\" height=\"34\" fill=\"url(#aw)\"/>\n<\/svg>\n\n<main class=\"stage\">\n  <section class=\"sign\" aria-labelledby=\"brand\">\n    <h1 id=\"brand\" class=\"board\">곡수마켓<\/h1>\n    <p class=\"tagline\">모은 티켓으로 물건을 사는<br>우리 학교 작은 가게<\/p>\n    <p class=\"open\"><span class=\"dot\" aria-hidden=\"true\"><\/span>11월 3일 화요일 · 문 열었어요<\/p>\n  <\/section>\n\n  <section class=\"counter\" aria-label=\"로그인\">\n    <ol class=\"steps\" aria-label=\"들어가는 순서\">\n      <li><button class=\"step\" type=\"button\" data-go=\"1\"><b>1<\/b><span>학년<\/span><\/button><\/li>\n      <li><button class=\"step\" type=\"button\" data-go=\"2\"><b>2<\/b><span>이름<\/span><\/button><\/li>\n      <li><button class=\"step\" type=\"button\" data-go=\"3\"><b>3<\/b><span>비밀번호<\/span><\/button><\/li>\n    <\/ol>\n\n    <div class=\"panel\" id=\"p1\">\n      <h2>몇 학년이에요?<\/h2>\n      <p class=\"hint\">내 학년을 눌러요.<\/p>\n      <div class=\"grades\">\n        <button class=\"grade chunk g3\" type=\"button\" data-grade=\"3\"><span class=\"num\">3<\/span><span class=\"unit\">학년<\/span><\/button>\n        <button class=\"grade chunk g4\" type=\"button\" data-grade=\"4\"><span class=\"num\">4<\/span><span class=\"unit\">학년<\/span><\/button>\n        <button class=\"grade chunk g5\" type=\"button\" data-grade=\"5\"><span class=\"num\">5<\/span><span class=\"unit\">학년<\/span><\/button>\n        <button class=\"grade chunk g6\" type=\"button\" data-grade=\"6\"><span class=\"num\">6<\/span><span class=\"unit\">학년<\/span><\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel\" id=\"p2\" hidden>\n      <div class=\"panel-head\">\n        <div>\n          <h2><span id=\"gradeLabel\">5<\/span>학년, 이름은?<\/h2>\n          <p class=\"hint\">내 이름을 찾아 눌러요.<\/p>\n        <\/div>\n        <button class=\"back chunk\" type=\"button\" data-go=\"1\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/><\/svg>\n          학년 바꾸기\n        <\/button>\n      <\/div>\n      <div class=\"names\" id=\"names\" role=\"list\"><\/div>\n    <\/div>\n\n    <form class=\"panel\" id=\"p3\" hidden novalidate>\n      <h2>비밀번호를 넣어요<\/h2>\n      <div class=\"who\">\n        <span class=\"avatar\" id=\"avatar\" aria-hidden=\"true\">하<\/span>\n        <p><span class=\"g\" id=\"whoGrade\">5학년<\/span><strong id=\"whoName\">김하늘<\/strong><\/p>\n        <button type=\"button\" data-go=\"2\">내가 아니에요<\/button>\n      <\/div>\n      <label class=\"lbl\" for=\"pw\">비밀번호<\/label>\n      <div class=\"pw\">\n        <input id=\"pw\" type=\"password\" autocomplete=\"current-password\" placeholder=\"선생님께 받은 비밀번호\" aria-describedby=\"err\">\n        <button class=\"eye\" type=\"button\" id=\"eye\" aria-label=\"비밀번호 보기\" aria-pressed=\"false\">\n          <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><\/svg>\n        <\/button>\n      <\/div>\n      <div class=\"err\" id=\"err\" role=\"alert\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\" fill=\"currentColor\" stroke=\"none\"/><path d=\"M12 7v6\" stroke=\"#fff\"/><path d=\"M12 17h.01\" stroke=\"#fff\"/><\/svg>\n        <p><strong>비밀번호가 달라요.<\/strong>한 글자씩 천천히 다시 넣어 봐요. 잊어버렸으면 선생님께 물어봐요.<\/p>\n      <\/div>\n      <button class=\"go chunk\" id=\"go\" type=\"submit\" disabled>\n        들어가기\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>\n      <\/button>\n    <\/form>\n  <\/section>\n<\/main>\n\n<nav class=\"links\" aria-label=\"다른 페이지\">\n  <a href=\"#ranking\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M6 20v-6h4v6\"/><path d=\"M10 20V8h4v12\"/><path d=\"M14 20v-9h4v9\"/><\/svg>\n    마켓 랭킹 보기\n  <\/a>\n  <a href=\"admin.html\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"10\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M8 10V7a4 4 0 0 1 8 0v3\"/><\/svg>\n    교사 페이지\n  <\/a>\n<\/nav>\n\n<div class=\"demo\" aria-label=\"시안 상태 보기\">\n  <span>시안 상태 보기 (비밀번호 1234만 통과):<\/span>\n  <button type=\"button\" data-go=\"1\">1 학년<\/button>\n  <button type=\"button\" data-go=\"2\">2 이름<\/button>\n  <button type=\"button\" data-go=\"3\">3 비밀번호<\/button>\n  <button type=\"button\" id=\"demoErr\">비밀번호 오류<\/button>\n<\/div>\n\n<script>\n(function(){\n  var NAMES = {\n    3:[\"강다온\",\"김로아\",\"박도윤\",\"서이안\",\"송하율\",\"오지호\",\"윤채아\",\"이준우\",\"장소율\",\"정우진\",\"최은호\",\"한별\"],\n    4:[\"고은찬\",\"김나린\",\"남궁솔\",\"문태오\",\"박서아\",\"신유찬\",\"안지유\",\"이로운\",\"임하람\",\"최지우\",\"한예린\",\"홍시원\"],\n    5:[\"김하늘\",\"김민재\",\"노아린\",\"류건우\",\"박지안\",\"배서윤\",\"윤시우\",\"이다인\",\"장하준\",\"전채원\",\"조은솔\",\"황보람\"],\n    6:[\"강서진\",\"구본혁\",\"김예나\",\"도하윤\",\"백승우\",\"손지아\",\"오현서\",\"이서준\",\"정하윤\",\"차민호\",\"최가온\",\"허윤아\"]\n  };\n  var state = {step:1, grade:null, name:null};\n  var $ = function(id){ return document.getElementById(id); };\n  var panels = [null, $('p1'), $('p2'), $('p3')];\n  var steps = document.querySelectorAll('.step');\n  var form = document.getElementById('p3');\n  var pw = document.getElementById('pw');\n  var go = document.getElementById('go');\n\n  function show(n){\n    if(n >= 2 && !state.grade) state.grade = 5;\n    if(n >= 3 && !state.name){ state.name = NAMES[state.grade][0]; }\n    if(n === 2) renderNames();\n    if(n === 3) renderWho();\n    state.step = n;\n    for(var i=1;i<=3;i++){ panels[i].hidden = (i !== n); }\n    steps.forEach(function(b, i){\n      var k = i+1;\n      b.classList.toggle('done', k < n);\n      if(k === n) b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current');\n      var label = k===1 ? (state.grade ? state.grade+'학년' : '학년') : k===2 ? (state.name && n>2 ? state.name : '이름') : '비밀번호';\n      b.querySelector('span').textContent = label;\n      b.querySelector('b').innerHTML = k < n\n        ? '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>'\n        : String(k);\n    });\n    if(n === 3){ form.classList.remove('invalid'); setTimeout(function(){ pw.focus(); }, 30); }\n  }\n\n  function renderNames(){\n    document.getElementById('gradeLabel').textContent = state.grade;\n    var box = document.getElementById('names');\n    box.innerHTML = '';\n    NAMES[state.grade].forEach(function(n){\n      var b = document.createElement('button');\n      b.type = 'button'; b.className = 'name chunk'; b.textContent = n; b.setAttribute('role','listitem');\n      b.addEventListener('click', function(){ state.name = n; pw.value=''; go.disabled = true; show(3); });\n      box.appendChild(b);\n    });\n  }\n  function renderWho(){\n    document.getElementById('whoGrade').textContent = state.grade + '학년';\n    document.getElementById('whoName').textContent = state.name;\n    document.getElementById('avatar').textContent = state.name.slice(-2);\n  }\n\n  document.querySelectorAll('[data-grade]').forEach(function(b){\n    b.addEventListener('click', function(){ state.grade = +b.dataset.grade; state.name = null; show(2); });\n  });\n  document.querySelectorAll('[data-go]').forEach(function(b){\n    b.addEventListener('click', function(){ show(+b.dataset.go); });\n  });\n\n  pw.addEventListener('input', function(){\n    go.disabled = !pw.value;\n    form.classList.remove('invalid');\n    pw.removeAttribute('aria-invalid');\n  });\n  document.getElementById('eye').addEventListener('click', function(){\n    var on = pw.type === 'password';\n    pw.type = on ? 'text' : 'password';\n    this.setAttribute('aria-pressed', on);\n    this.setAttribute('aria-label', on ? '비밀번호 숨기기' : '비밀번호 보기');\n  });\n\n  function fail(){\n    form.classList.remove('invalid'); void form.offsetWidth;\n    form.classList.add('invalid'); pw.setAttribute('aria-invalid','true');\n    pw.select();\n  }\n  form.addEventListener('submit', function(e){\n    e.preventDefault();\n    if(!pw.value) return;\n    if(pw.value === '1234'){\n      go.classList.add('loading'); go.firstChild.textContent = '들어가는 중… ';\n      setTimeout(function(){ location.href = 'student.html'; }, 500);\n    } else { fail(); }\n  });\n  document.getElementById('demoErr').addEventListener('click', function(){\n    show(3); pw.value = 'haneul'; go.disabled = false; fail();\n  });\n\n  show(1);\n})();\n<\/script>\n<\/body>\n<\/html>\n","c-student":"<!doctype html>\n<html lang=\"ko\">\n<head><base href=\"c/\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>곡수마켓 · 상품 목록<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gothic+A1:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink:#1D2340; --ink-2:#4A5070;\n  --blue:#2A55E5; --blue-d:#1F43BF; --blue-l:#DCE5FC;\n  --yellow:#FFC83D; --yellow-l:#FFEFC4;\n  --tomato:#F26440; --tomato-d:#C4381B; --tomato-l:#FDE1D8;\n  --ground:#EDF1F7; --muted:#DADFE8; --card:#FFFFFF;\n  --display:\"Bagel Fat One\",\"Gothic A1\",sans-serif;\n  --body:\"Gothic A1\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",sans-serif;\n  --press:120ms cubic-bezier(.2,.8,.2,1);\n}\n*{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0; font-family:var(--body); color:var(--ink); background:var(--ground); line-height:1.5; caret-color:var(--blue); word-break:keep-all; overflow-wrap:anywhere; overflow-x:hidden}\n::selection{background:var(--yellow); color:var(--ink)}\n:focus-visible{outline:3px solid var(--ink); outline-offset:3px}\n.shop :focus-visible{outline-color:var(--yellow)}\nbutton{font:inherit; color:inherit; cursor:pointer}\na{color:inherit}\nsvg.i{width:22px; height:22px; flex:none}\n.sprite{position:absolute; width:0; height:0; overflow:hidden}\n\n/* chunky press */\n.chunk{\n  border:3px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink);\n  transition:transform var(--press), box-shadow var(--press), background var(--press);\n}\n.chunk:not(:disabled):hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink)}\n.chunk:not(:disabled):active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}\n\n/* ---------- shop header ---------- */\n.shop{background:var(--blue); border-bottom:3px solid var(--ink); color:#fff}\n.bar{max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}\n.brand{font:400 2.1rem/1 var(--display); color:var(--yellow); text-decoration:none; text-shadow:3px 3px 0 var(-- "wrap\">\n  <nav class=\"tabs\" aria-label=\"마켓 메뉴\">\n    <a class=\"tab chunk\" href=\"#shelf\" aria-current=\"page\">\n      <svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-basket\"/><\/svg>상품 목록<\/a>\n    <a class=\"tab chunk\" href=\"#funding\">\n      <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"9\" r=\"3\"/><circle cx=\"16\" cy=\"9\" r=\"3\"/><path d=\"M3 20c0-3 2.5-5 5-5s5 2 5 5M11 20c0-3 2.5-5 5-5s5 2 5 5\"/><\/svg>공동 펀딩<\/a>\n    <a class=\"tab chunk\" href=\"#ranking\">\n      <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20h16\"/><path d=\"M6 20v-6h4v6\"/><path d=\"M10 20V8h4v12\"/><path d=\"M14 20v-9h4v9\"/><\/svg>마켓 랭킹<\/a>\n  <\/nav>\n\n  <section class=\"fund\" id=\"funding\" aria-labelledby=\"fundTitle\">\n    <span class=\"tag\">공동 펀딩<\/span>\n    <div>\n      <h2 id=\"fundTitle\">교실에 빈백 소파 들이기<\/h2>\n      <p>다 같이 티켓을 모으고 있어요 · <b>11월 21일까지 (18일 남음)<\/b><\/p>\n    <\/div>\n    <div>\n      <ol class=\"stamps\" role=\"img\" aria-label=\"300장 중 186장 모임, 62퍼센트\">\n        <li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li class=\"on\"><svg aria-hidden=\"true\"><use href=\"#i-check\"/><\/svg><\/li><li><\/li><li><\/li><li><\/li><li><\/li>\n      <\/ol>\n      <p class=\"count\"><b>186<\/b> / 300장 모였어요 · 도장 한 칸에 30장<\/p>\n    <\/div>\n    <a class=\"cta chunk\" href=\"#funding\">나도 보태기\n      <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/a>\n  <\/section>\n\n  <section id=\"shelf\" aria-labelledby=\"shelfTitle\">\n    <div class=\"shelf-head\">\n      <h1 id=\"shelfTitle\">판매 중인 물건<span id=\"cnt\">8개<\/span><\/h1>\n      <label class=\"only\"><input type=\"checkbox\" id=\"only\"><span class=\"sw\" aria-hidden=\"true\"><\/span>지금 살 수 있는 것만<\/label>\n    <\/div>\n    <ul class=\"grid\" id=\"grid\"><\/ul>\n  <\/section>\n<\/div>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><span id=\"toastMsg\"><\/span><button type=\"button\" data-open=\"cart\">장바구니 보기<\/button><\/div>\n\n<dialog class=\"drawer\" id=\"drawer\" aria-label=\"장바구니와 구매 기록\">\n  <div class=\"dw-head\">\n    <div class=\"dw-tabs\" role=\"tablist\">\n      <button class=\"dw-tab chunk\" role=\"tab\" id=\"t-cart\" aria-controls=\"cartPanel\" aria-selected=\"true\" type=\"button\">장바구니 <span class=\"n\" id=\"tabN\">2<\/span><\/button>\n      <button class=\"dw-tab chunk\" role=\"tab\" id=\"t-hist\" aria-controls=\"histPanel\" aria-selected=\"false\" type=\"button\">구매 기록<\/button>\n    <\/div>\n    <button class=\"x chunk\" type=\"button\" id=\"close\" aria-label=\"닫기\">\n      <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/><\/svg>\n    <\/button>\n  <\/div>\n  <div class=\"dw-body\" id=\"cartPanel\" role=\"tabpanel\" aria-labelledby=\"t-cart\"><\/div>\n  <div class=\"dw-body\" id=\"histPanel\" role=\"tabpanel\" aria-labelledby=\"t-hist\" hidden><\/div>\n  <div class=\"dw-foot\" id=\"foot\"><\/div>\n<\/dialog>\n\n<script>\n(function(){\n  var me = {tickets:23};\n  var items = [\n    {id:1, name:\"연필 세트\", cost:5, qty:12, art:\"pencil\", tint:\"y\"},\n    {id:2, name:\"간식 쿠폰\", cost:8, qty:3, art:\"coupon\", tint:\"t\"},\n    {id:3, name:\"자리 바꾸기권\", cost:15, qty:6, art:\"swap\", tint:\"b\"},\n    {id:4, name:\"급식 먼저 먹기권\", cost:20, qty:2, art:\"bowl\", tint:\"y\"},\n    {id:5, name:\"반짝이 스티커\", cost:3, qty:0, art:\"star\", tint:\"t\"},\n    {id:6, name:\"보드게임 30분 이용권\", cost:30, qty:5, art:\"game\", tint:\"b\"},\n    {id:7, name:\"말랑 지우개\", cost:4, qty:20, art:null, tint:\"g\", link:\"#\"},\n    {id:8, name:\"쉬는 시간 음악 선곡권\", cost:25, qty:1, art:null, tint:\"y\"}\n  ];\n  var cart = {1:1, 2:1};\n  var hist = [\n    {date:\"11월 2일\", name:\"간식 쿠폰\", n:1, cost:8, done:false},\n    {date:\"11월 1일\", name:\"자리 바꾸기권\", n:1, cost:15, done:true},\n    {date:\"10월 28일\", name:\"연필 세트\", n:2, cost:10, done:true}\n  ];\n  var $ = function(id){ return document.getElementById(id); };\n  var byId = function(id){ return items.filter(function(i){ return i.id == id; })[0]; };\n  var drawer = $('drawer'), justBought = false, toastT;\n\n  function visual(it, cls){\n    var t = '<div class=\"' + cls + ' t-' + it.tint + '\">';\n    if(it.art) t += '<svg class=\"art\" viewBox=\"0 0 120 90\" aria-hidden=\"true\"><use href=\"#a-' + it.art + '\"/><\/svg>';\n    else t += '<span class=\"noimg\" data-n=\"사진 준비 중\" aria-hidden=\"true\">' + it.name.charAt(0) + '<\/span>';\n    return t;\n  }\n  function cartCount(){ var c=0; for(var k in cart) c+=cart[k]; return c; }\n  function cartTotal(){ var s=0; for(var k in cart) s+=byId(k).cost*cart[k]; return s; }\n\n  function renderGrid(){\n    var only = $('only').checked, html = '', shown = 0;\n    items.forEach(function(it){\n      var out = it.qty <= 0, low = !out && it.qty <= 3, can = me.tickets >= it.cost, inCart = cart[it.id] || 0;\n      if(only && (out || !can)) return;\n      shown++;\n      var btn;\n      if(out) btn = '<button class=\"add out chunk\" disabled>품절<\/button>';\n      else if(!can) btn = '<button class=\"add short chunk\" disabled>티켓 부족<small>' + (it.cost - me.tickets) + '장 더 필요해요<\/small><\/button>';\n      else if(inCart >= it.qty) btn = '<button class=\"add out chunk\" disabled>남은 만큼 다 담았어요<\/button>';\n      else btn = '<button class=\"add chunk\" data-add=\"' + it.id + '\"><svg class=\"i\" aria-hidden=\"true\"><use href=\"#i-basket\"/><\/svg>담기<\/button>';\n      html += '<li class=\"card' + (out ? ' is-out' : '') + '\"><span class=\"hang\" aria-hidden=\"true\"><\/span>' + visual(it, 'window') +\n        (low ? '<span class=\"sticker\"><small>품절 임박<\/small>' + it.qty + '개 남음<\/span>' : '') +\n        (inCart ? '<span class=\"got\">' + inCart + '개 담음<\/span>' : '') +\n        (out ? '<span class=\"stamp\">품절<\/span>' : '') + '<\/div>' +\n        '<p class=\"price\" style=\"margin-bottom:0\" aria-label=\"가격 ' + it.cost + '장\"><b>' + it.cost + '<\/b>장<\/p>' +\n        '<h3>' + it.name + '<\/h3>' +\n        '<p class=\"stock\">' + (out ? '재고 없음' : '재고 ' + it.qty + '개') +\n        (it.link ? ' · <a class=\"more\" href=\"' + it.link + '\">자세히 보기<\/a>' : '') + '<\/p>' +\n        '<div class=\"foot\">' + btn + '<\/div><\/li>';\n    });\n    if(!shown) html = '<li class=\"empty\"><p>지금 티켓으로 살 수 있는 물건이 없어요.<\/p><small>티켓을 더 모으거나, 스위치를 꺼서 모든 물건을 봐요.<\/small><\/li>';\n    $('grid').innerHTML = html;\n    $('cnt').textContent = shown + '개';\n  }\n\n  function renderHeader(bumpWallet){\n    $('tk').textContent = me.tickets;\n    var c = cartCount();\n    var b = $('badge'); b.textContent = c; b.hidden = !c;\n    $('tabN').textContent = c; $('tabN').hidden = !c;\n    if(bumpWallet){ var w=$('wallet'); w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump'); }\n  }\n\n  function renderCart(){\n    var p = $('cartPanel'), f = $('foot');\n    if(justBought){\n      var conf = '';\n      var cols = ['#2A55E5','#FFC83D','#F26440','#fff'];\n      for(var i=0;i<26;i++){\n        conf += '<i style=\"left:' + (Math.random()*100) + '%;width:' + (10+Math.random()*8) + 'px;height:' + (8+Math.random()*10) + 'px;background:' + cols[i%4] + ';animation-delay:' + (Math.random()*.35) + 's;--r:' + (Math.random()*720-360) + 'deg\"><\/i>';\n      }\n      p.innerHTML = '<div class=\"confetti\" aria-hidden=\"true\">' + conf + '<\/div><div class=\"yay\" role=\"status\"><span class=\"big\">샀어요!<\/span>' +\n        '<h3>선생님이 곧 전해 줄 거예요<\/h3><p>남은 티켓은 ' + me.tickets + '장이에요.<br>받은 물건은 구매 기록에서 확인해요.<\/p>' +\n        '<div class=\"row\"><button class=\"plain chunk\" type=\"button\" data-tab=\"hist\">구매 기록 보기<\/button><button class=\"plain chunk\" type=\"button\" data-close>계속 구경하기<\/button><\/div><\/div>';\n      f.hidden = true; return;\n    }\n    var keys = Object.keys(cart);\n    if(!keys.length){\n      p.innerHTML = '<div class=\"nothing\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"color:var(--ink-2)\"><use href=\"#i-basket\"/><\/svg><h3>장바구니가 비어 있어요<\/h3><p>마음에 드는 물건의 [담기]를 눌러요.<\/p><button class=\"plain chunk\" type=\"button\" data-close>물건 고르러 가기<\/button><\/div>';\n      f.hidden = true; return;\n    }\n    var h = '';\n    keys.forEach(function(k){\n      var it = byId(k), n = cart[k];\n      h += '<div class=\"line\">' + visual(it, 'thumb') + '<\/div><div><h4>' + it.name + '<\/h4><p>' + it.cost + '장 × ' + n + '개 = <b>' + (it.cost*n) + '장<\/b><\/p><\/div>' +\n        '<div class=\"qty\"><button class=\"chunk\" type=\"button\" data-dec=\"' + k + '\" aria-label=\"' + it.name + ' 하나 빼기\"><svg aria-hidden=\"true\"><use href=\"#i-minus\"/><\/svg><\/button><output aria-label=\"수량\">' + n + '<\/output>' +\n        '<button class=\"chunk\" type=\"button\" data-inc=\"' + k + '\" aria-label=\"' + it.name + ' 하나 더\"' + (n >= it.qty ? ' disabled' : '') + '><svg aria-hidden=\"true\"><use href=\"#i-plus\"/><\/svg><\/button><\/div><\/div>';\n    });\n    p.innerHTML = h;\n    var total = cartTotal(), left = me.tickets - total;\n    f.hidden = false;\n    f.innerHTML = '<dl class=\"sum\"><dt>담은 물건<\/dt><dd>' + total + '장<\/dd><dt>내 티켓<\/dt><dd>' + me.tickets + '장<\/dd>' +\n      '<dt class=\"left\">사고 나면 남는 티켓<\/dt><dd class=\"left\"><b>' + Math.max(left,0) + '<\/b>장<\/dd><\/dl>' +\n      (left < 0 ? '<p class=\"warn\"><svg aria-hidden=\"true\"><use href=\"#i-alert\"/><\/svg>티켓이 ' + (-left) + '장 모자라요. 물건을 하나 빼 볼까요?<\/p>' : '') +\n      '<button class=\"buy chunk\" type=\"button\" id=\"buy\"' + (left < 0 ? ' disabled' : '') + '>구매하기 <span class=\"chip\">' + total + '장<\/span><\/button>';\n  }\n\n  function renderHist(){\n    var h = '<ul class=\"hist\">';\n    hist.forEach(function(x){\n      h += '<li><h4>' + x.name + (x.n > 1 ? ' × ' + x.n : '') + '<\/h4><span class=\"st ' + (x.done ? 'done' : 'wait') + '\"><svg aria-hidden=\"true\"><use href=\"#i-' + (x.done ? 'check' : 'clock') + '\"/><\/svg>' + (x.done ? '받았어요' : '전달 대기') + '<\/span><p>' + x.date + ' · ' + x.cost + '장<\/p><\/li>';\n    });\n    $('histPanel').innerHTML = h + '<\/ul><p class=\"hist-note\">전달 대기 중인 물건은 선생님이 교실에서 직접 전해 줘요.<\/p>';\n  }\n\n  function setTab(which){\n    var c = which === 'cart';\n    $('t-cart').setAttribute('aria-selected', c); $('t-hist').setAttribute('aria-selected', !c);\n    $('cartPanel').hidden = !c; $('histPanel').hidden = c;\n    if(c) renderCart(); else { renderHist(); $('foot').hidden = true; }\n  }\n  function openDrawer(which){\n    hideToast();\n    setTab(which);\n    if(!drawer.open) drawer.showModal();\n  }\n  function closeDrawer(){\n    drawer.close();\n  }\n  drawer.addEventListener('close', function(){ if(justBought){ justBought = false; } });\n  drawer.addEventListener('click', function(e){\n    if(e.target === drawer){ closeDrawer(); return; }\n    var t = e.target.closest('button'); if(!t) return;\n    if(t.id === 't-cart') setTab('cart');\n    else if(t.id === 't-hist') setTab('hist');\n    else if(t.id === 'close' || t.hasAttribute('data-close')) closeDrawer();\n    else if(t.dataset.tab){ justBought = false; setTab(t.dataset.tab); }\n    else if(t.dataset.inc){ cart[t.dataset.inc]++; sync(); }\n    else if(t.dataset.dec){ var k=t.dataset.dec; if(--cart[k] <= 0) delete cart[k]; sync(); }\n    else if(t.id === 'buy') buy();\n  });\n\n  function buy(){\n    var total = cartTotal(); if(total > me.tickets) return;\n    me.tickets -= total;\n    Object.keys(cart).forEach(function(k){\n      var it = byId(k); it.qty -= cart[k];\n      hist.unshift({date:\"오늘\", name:it.name, n:cart[k], cost:it.cost*cart[k], done:false});\n    });\n    cart = {}; justBought = true;\n    renderHeader(true); renderGrid(); renderCart();\n  }\n\n  function sync(){ renderHeader(); renderGrid(); if(drawer.open && !$('cartPanel').hidden) renderCart(); }\n\n  function hideToast(){ $('toast').classList.remove('show'); }\n  function toast(msg){\n    $('toastMsg').textContent = msg;\n    $('toast').classList.add('show');\n    clearTimeout(toastT); toastT = setTimeout(hideToast, 2400);\n  }\n\n  $('grid').addEventListener('click', function(e){\n    var b = e.target.closest('[data-add]'); if(!b) return;\n    var id = b.dataset.add; cart[id] = (cart[id] || 0) + 1;\n    sync();\n    var badge = $('badge'); badge.classList.remove('pop'); void badge.offsetWidth; badge.classList.add('pop');\n    toast(byId(id).name + ' 담았어요');\n    var nb = document.querySelector('[data-add=\"' + id + '\"]'); if(nb) nb.focus();\n  });\n  document.querySelectorAll('[data-open]').forEach(function(b){\n    b.addEventListener('click', function(){ openDrawer(b.dataset.open); });\n  });\n  $('only').addEventListener('change', renderGrid);\n\n  renderHeader(); renderGrid();\n})();\n<\/script>\n<\/body>\n<\/html>\n","c-admin":"<!doctype html>\n<html lang=\"ko\">\n<head><base href=\"c/\">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>곡수마켓 · 교사 대시보드<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gothic+A1:wght@400;600;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --ink:#1D2340; --ink-2:#4A5070; --in oot tr td:first-child{border-radius:0 0 0 12px}\n.gt tfoot tr td:last-child{border-radius:0 0 12px 0}\n\n/* toast */\n.toast{\n  position:fixed; left:50%; bottom:20px; z-index:30; transform:translate(-50%,160%); max-width:calc(100% - 32px);\n  display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; background:var(--ink); color:#fff;\n  border-radius:12px; font-weight:800; font-size:.92rem; box-shadow:3px 3px 0 var(--yellow);\n  transition:transform .22s cubic-bezier(.2,.8,.2,1);\n}\n.toast.show{transform:translate(-50%,0)}\n.toast .btn{min-height:34px; background:var(--yellow); box-shadow:none; border-color:var(--yellow)}\n\n@media (max-width:1000px){\n  .cols{grid-template-columns:minmax(0,1fr)}\n}\n@media (max-width:720px){\n  .top-in{padding:10px 16px; flex-wrap:wrap}\n  .top-in time{display:none}\n  .wrap{padding:18px 16px 56px}\n  .summary{grid-template-columns:minmax(0,1fr)}\n  .summary > div + div{border-left:0; border-top:2px solid var(--ink)}\n  .summary > div{padding:10px 16px}\n  .summary dd{font-size:1.35rem}\n  .tbl thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}\n  .tbl, .tbl tbody{display:block}\n  .tbl tr{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:12px 16px; border-bottom:1px solid var(--line)}\n  .tbl td{display:block; padding:0; border:0}\n  .tbl td.stu{grid-column:1}\n  .tbl td.item{grid-column:1}\n  .tbl td.tk{grid-column:2; grid-row:1; text-align:right}\n  .tbl td.when{grid-column:1}\n  .tbl td.act{grid-column:2; grid-row:2 / span 2; align-self:end; text-align:right}\n  .tbl tr.did td{background:none}\n  .tbl tr.did{background:var(--blue-l)}\n  .quick{grid-template-columns:minmax(0,1fr)}\n}\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important; transition:none!important}\n}\n<\/style>\n<\/head>\n<body>\n\n<header class=\"top\">\n  <div class=\"top-in\">\n    <a class=\"brand\" href=\"#\"><b>곡수마켓<\/b><span>교사 대시보드<\/span><\/a>\n    <span class=\"sp\"><\/span>\n    <time datetime=\"2026-11-03\">11월 3일 화요일<\/time>\n    <a class=\"btn out\" href=\"main.html\">\n      <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 4H5v16h5\"/><path d=\"M14 8l4 4-4 4M18 12H9\"/><\/svg>\n      로그아웃\n    <\/a>\n  <\/div>\n<\/header>\n\n<main class=\"wrap\">\n  <div class=\"head\">\n    <h1>오늘의 가게 현황<\/h1>\n    <p>오전 9시 40분 기준<\/p>\n  <\/div>\n\n  <dl class=\"summary\">\n    <div><dt>총 학생 수<\/dt><dd class=\"num\">114<small>명<\/small><\/dd><\/div>\n    <div><dt>총 구매 건수<\/dt><dd class=\"num\" id=\"sumBuy\">348<small>건<\/small><\/dd><\/div>\n    <div class=\"hot\"><dt>전달 대기<\/dt><dd class=\"num\"><span id=\"sumWait\">7<\/span><small>건<\/small><\/dd><\/div>\n  <\/dl>\n\n  <div class=\"cols\">\n    <section class=\"panel\" aria-labelledby=\"pTitle\">\n      <div class=\"p-head\">\n        <h2 id=\"pTitle\">전달 대기 <span class=\"pill num\" id=\"pCount\">7<\/span><\/h2>\n        <button class=\"btn\" type=\"button\" id=\"all\">\n          <svg class=\"i\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12.5l4 4L15 8.5\"/><path d=\"M11 15.5l1 1L21 7.5\"/><\/svg>\n          <span id=\"allLabel\">보이는 7건 모두 전달 완료<\/span>\n        <\/button>\n      <\/div>\n      <div class=\"filters\" role=\"group\" aria-label=\"학년으로 거르기\" id=\"filters\"><\/div>\n      <table class=\"tbl\">\n        <thead><tr><th scope=\"col\">학생<\/th><th scope=\"col\">물건<\/th><th scope=\"col\" class=\"r\">티켓<\/th><th scope=\"col\">구매 시각<\/th><th scope=\"col\" class=\"r\"><span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">처리<\/span><\/th><\/tr><\/thead>\n        <tbody id=\"rows\"><\/tbody>\n      <\/table>\n      <div class=\"p-foot\">\n        <span class=\"when\">오래 기다린 순서로 보여요<\/span>\n        <a href=\"#purchases\">구매 내역 전체 보기<\/a>\n      <\/div>\n    <\/section>\n\n    <div>\n      <section class=\"panel\" aria-labelledby=\"qTitle\">\n        <div class=\"p-head\"><h2 id=\"qTitle\">빠른 메뉴<\/h2><\/div>\n        <nav class=\"quick\" aria-labelledby=\"qTitle\">\n          <a class=\"q\" href=\"#purchases\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h12v18l-3-2-3 2-3-2-3 2z\"/><path d=\"M9 8h6M9 12h6\"/><\/svg>\n            <div><b>구매 내역 관리<\/b><span>전달 상태 변경<\/span><\/div>\n            <span class=\"pill num\" id=\"qWait\">대기 7<\/span>\n          <\/a>\n          <a class=\"q\" href=\"#items\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 8l9-5 9 5v8l-9 5-9-5z\"/><path d=\"M3 8l9 5 9-5M12 13v8\"/><\/svg>\n            <div><b>상품 관리<\/b><span>상품 추가·수정·삭제<\/span><\/div>\n          <\/a>\n          <a class=\"q\" href=\"student.html\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 9l2-5h14l2 5\"/><path d=\"M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z\"/><path d=\"M5 13v7h14v-7\"/><\/svg>\n            <div><b>학생 페이지<\/b><span>학생 화면 확인<\/span><\/div>\n          <\/a>\n          <a class=\"q\" href=\"#funding\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"9\" r=\"3\"/><circle cx=\"16\" cy=\"9\" r=\"3\"/><path d=\"M3 20c0-3 2.5-5 5-5s5 2 5 5M11 20c0-3 2.5-5 5-5s5 2 5 5\"/><\/svg>\n            <div><b>공동 펀딩 관리<\/b><span>통합 모금 만들기<\/span><\/div>\n          <\/a>\n        <\/nav>\n      <\/section>\n\n      <section class=\"panel\" aria-labelledby=\"gTitle\">\n        <div class=\"p-head\"><h2 id=\"gTitle\">학년별 현황<\/h2><\/div>\n        <table class=\"gt\">\n          <thead><tr><th scope=\"col\">학년<\/th><th scope=\"col\" class=\"r\">학생 수<\/th><th scope=\"col\">총 티켓<\/th><\/tr><\/thead>\n          <tbody id=\"grades\"><\/tbody>\n          <tfoot><tr><td>합계<\/td><td class=\"r num\">114명<\/td><td class=\"num\">6,732장<\/td><\/tr><\/tfoot>\n        <\/table>\n      <\/section>\n    <\/div>\n  <\/div>\n<\/main>\n\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><span id=\"toastMsg\"><\/span><button class=\"btn\" type=\"button\" id=\"undo\">되돌리기<\/button><\/div>\n\n<script>\n(function(){\n  var $ = function(id){ return document.getElementById(id); };\n  var grades = [\n    {g:3, n:26, t:1184}, {g:4, n:28, t:1402}, {g:5, n:31, t:1936}, {g:6, n:29, t:2210}\n  ];\n  var max = Math.max.apply(null, grades.map(function(x){ return x.t; }));\n  $('grades').innerHTML = grades.map(function(x){\n    return '<tr data-href=\"#students-' + x.g + '\"><td class=\"g\"><a href=\"#students-' + x.g + '\">' + x.g + '학년<\/a><\/td><td class=\"r num\">' + x.n + '명<\/td>' +\n      '<td><span class=\"bar\"><i style=\"width:' + Math.round(x.t / max * 110) + 'px\"><\/i><b class=\"num\">' + x.t.toLocaleString('ko-KR') + '장<\/b><\/span><\/td><\/tr>';\n  }).join('');\n  $('grades').addEventListener('click', function(e){\n    var tr = e.target.closest('tr'); if(tr && !e.target.closest('a')) location.hash = tr.dataset.href;\n  });\n\n  var rows = [\n    {id:1, g:4, name:\"한예린\", item:\"보드게임 30분 이용권\", n:1, t:30, when:\"10월 31일 13:05\", late:3},\n    {id:2, g:5, name:\"윤시우\", item:\"말랑 지우개\", n:1, t:4, when:\"11월 1일 12:40\", late:2},\n    {id:3, g:6, name:\"정하윤\", item:\"급식 먼저 먹기권\", n:1, t:20, when:\"어제 12:01\"},\n    {id:4, g:4, name:\"최지우\", item:\"반짝이 스티커\", n:3, t:9, when:\"어제 13:22\"},\n    {id:5, g:6, name:\"이서준\", item:\"자리 바꾸기권\", n:1, t:15, when:\"어제 14:40\"},\n    {id:6, g:3, name:\"박도윤\", item:\"연필 세트\", n:2, t:10, when:\"오늘 08:55\"},\n    {id:7, g:5, name:\"김하늘\", item:\"간식 쿠폰\", n:1, t:8, when:\"오늘 09:12\"}\n  ];\n  var filter = 0, lastUndo = null, toastT;\n  var CHECK = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"/><\/svg>';\n  var CLOCK = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/svg>';\n\n  function waiting(){ return rows.filter(function(r){ return !r.done; }); }\n  function visible(){ return rows.filter(function(r){ return !r.gone && (!filter || r.g === filter); }); }\n\n  function render(){\n    var w = waiting();\n    $('sumWait').textContent = w.length; $('pCount').textContent = w.length; $('qWait').textContent = '대기 ' + w.length;\n\n    var counts = {0:w.length}; [3,4,5,6].forEach(function(g){ counts[g] = w.filter(function(r){ return r.g === g; }).length; });\n    $('filters').innerHTML = [0,3,4,5,6].map(function(g){\n      return '<button class=\"chip\" type=\"button\" data-f=\"' + g + '\" aria-pressed=\"' + (filter === g) + '\">' + (g ? g + '학년' : '전체') + '<span class=\"c num\">' + counts[g] + '<\/span><\/button>';\n    }).join('');\n\n    var v = visible(), open = v.filter(function(r){ return !r.done; }).length;\n    $('allLabel').textContent = '보이는 ' + open + '건 모두 전달 완료';\n    $('all').disabled = !open; $('all').style.visibility = open ? 'visible' : 'hidden';\n\n    if(!v.length){\n      $('rows').innerHTML = '<tr><td colspan=\"5\" class=\"empty\"><b>전달할 물건이 없어요<\/b><span>' + (filter ? filter + '학년은 모두 전달했어요.' : '모두 전달했어요. 수고하셨어요!') + '<\/span><\/td><\/tr>';\n      return;\n    }\n    $('rows').innerHTML = v.map(function(r){\n      return '<tr' + (r.done ? ' class=\"did\"' : '') + '>' +\n        '<td class=\"stu\"><b>' + r.name + '<\/b><span>' + r.g + '학년<\/span><\/td>' +\n        '<td class=\"item\">' + r.item + '<em>× ' + r.n + '<\/em><\/td>' +\n        '<td class=\"tk r num\">' + r.t + '장<\/td>' +\n        '<td class=\"when\">' + r.when + (r.late && !r.done ? '<br><span class=\"late\">' + CLOCK + r.late + '일째 기다림<\/span>' : '') + '<\/td>' +\n        '<td class=\"act r\">' + (r.done\n          ? '<span class=\"done-note\">' + CHECK + '전달함<\/span><button class=\"btn quiet\" type=\"button\" data-undo=\"' + r.id + '\">되돌리기<\/button>'\n          : '<button class=\"btn primary\" type=\"button\" data-done=\"' + r.id + '\">' + CHECK.replace('stroke-width=\"3\"','stroke-width=\"3\" width=\"18\" height=\"18\"') + '전달 완료<\/button>') +\n        '<\/td><\/tr>';\n    }).join('');\n  }\n\n  function find(id){ return rows.filter(function(r){ return r.id == id; })[0]; }\n  function markDone(list){\n    list.forEach(function(r){ r.done = true; clearTimeout(r.timer); r.timer = setTimeout(function(){ r.gone = true; render(); }, 5000); });\n    lastUndo = list;\n    render();\n    showToast(list.length === 1 ? list[0].name + ' 학생에게 ' + list[0].item + ' 전달 완료' : list.length + '건을 전달 완료로 바꿨어요');\n  }\n  function undo(list){\n    list.forEach(function(r){ r.done = false; r.gone = false; clearTimeout(r.timer); });\n    hideToast(); render();\n  }\n  function showToast(m){ $('toastMsg').textContent = m; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(hideToast, 5000); }\n  function hideToast(){ $('toast').classList.remove('show'); }\n\n  document.addEventListener('click', function(e){\n    var b = e.target.closest('button'); if(!b) return;\n    if(b.dataset.f !== undefined){ filter = +b.dataset.f; render(); }\n    else if(b.dataset.done){ markDone([find(b.dataset.done)]); var u = document.querySelector('[data-undo=\"' + b.dataset.done + '\"]'); if(u) u.focus(); }\n    else if(b.dataset.undo){ undo([find(b.dataset.undo)]); }\n    else if(b.id === 'all'){ markDone(visible().filter(function(r){ return !r.done; })); }\n    else if(b.id === 'undo' && lastUndo){ undo(lastUndo); lastUndo = null; }\n  });\n\n  render();\n})();\n<\/script>\n<\/body>\n<\/html>\n"}</script>
<script>
const DOCS = JSON.parse(document.getElementById("docs").textContent);
const NOTES = {"a":{"name":"종이 티켓","desc":"학교 매점의 노란 종이 티켓이 중심. 회녹색 계산대 바탕, 흰 영수증 카드, 절취선 상품 카드, 빨강·파랑 고무도장(품절·구매 완료). 글꼴 Black Han Sans(숫자·간판) + Gothic A1. 데모 비밀번호 1234."},"b":{"name":"교실 안내판","desc":"공공 안내판처럼 먹색·회백·스쿨존 노랑 3색. 굵은 4px 선과 직각 블록, 큰 숫자(Barlow), 학년 번호판, 지하철 노선도식 단계 표시. 글꼴 Gothic A1 + Barlow. 데모 비밀번호 1234."},"c":{"name":"장난감 가게","desc":"문방구·장난감 포장 느낌. 두꺼운 남색 테두리와 눌리는 오프셋 그림자, 코발트·해바라기 노랑·토마토 3색. 블리스터 포장 상품 카드, 도장판 펀딩. 글꼴 Bagel Fat One + Gothic A1. 데모 비밀번호 1234."}};
const state = { draft: "a", page: "main", width: "desktop" };
try { Object.assign(state, JSON.parse(localStorage.getItem("koksu-compare") || "{}")); } catch (e) {}
const stage = document.getElementById("stage");
const note = document.getElementById("note");
const pageLabel = {"main":"메인","student":"학생 마켓","admin":"교사 관리"};

function frame(d) {
  const wrap = document.createElement("div");
  wrap.className = "frame";
  const cap = document.createElement("p");
  cap.className = "cap";
  cap.innerHTML = "<b>시안 " + d.toUpperCase() + "</b> · " + (NOTES[d]?.name ?? "") + " — " + pageLabel[state.page];
  const f = document.createElement("iframe");
  f.title = "시안 " + d.toUpperCase() + " " + pageLabel[state.page];
  f.srcdoc = DOCS[d + "-" + state.page];
  wrap.append(cap, f);
  return wrap;
}

function render() {
  document.querySelectorAll("[data-draft]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.draft === state.draft));
  document.querySelectorAll("[data-page]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.page === state.page));
  document.querySelectorAll("[data-width]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.width === state.width));
  const all = state.draft === "all";
  stage.className = (all ? "side " : "") + "w-" + state.width;
  stage.replaceChildren(...(all ? ["a", "b", "c"] : [state.draft]).map(frame));
  note.innerHTML = all
    ? "세 시안을 같은 페이지로 나란히 봅니다. 좁으면 가로로 스크롤하세요."
    : "<b>시안 " + state.draft.toUpperCase() + " · " + (NOTES[state.draft]?.name ?? "") + "</b> — " + (NOTES[state.draft]?.desc ?? "");
  try { localStorage.setItem("koksu-compare", JSON.stringify(state)); } catch (e) {}
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.draft) state.draft = b.dataset.draft;
  if (b.dataset.page) state.page = b.dataset.page;
  if (b.dataset.width) state.width = b.dataset.width;
  render();
});
render();
</script>
